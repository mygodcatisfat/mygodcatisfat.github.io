const DOCX_PAGE_W = 16838, DOCX_PAGE_H = 11906, DOCX_MARGIN = 567;
const DOCX_TABLE_W = DOCX_PAGE_W - DOCX_MARGIN * 2;

function docxColWidths() {
  return COLS.map(c => Math.round(c.w / COL_WEIGHT_TOTAL * DOCX_TABLE_W));
}

function docxRun(text, bold, sizeHalfPt) {
  const rPr = `<w:rPr><w:rFonts w:ascii="標楷體" w:eastAsia="標楷體" w:hAnsi="標楷體"/>` +
              `${bold ? '<w:b/>' : ''}<w:sz w:val="${sizeHalfPt}"/><w:szCs w:val="${sizeHalfPt}"/></w:rPr>`;
  return `<w:r>${rPr}<w:t xml:space="preserve">${escapeXml(text)}</w:t></w:r>`;
}

function docxPara(text, bold, align, sizeHalfPt) {
  const pPr = `<w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/>` +
              `<w:jc w:val="${align === 'center' ? 'center' : 'left'}"/></w:pPr>`;
  return `<w:p>${pPr}${text === '' ? '' : docxRun(text, bold, sizeHalfPt)}</w:p>`;
}

function docxCell(cell, width, isHeader) {
  const shd = isHeader ? '<w:shd w:val="clear" w:color="auto" w:fill="F2F2F2"/>' : '';
  const tcPr = `<w:tcPr><w:tcW w:w="${width}" w:type="dxa"/>${shd}<w:vAlign w:val="center"/></w:tcPr>`;
  const lines = cell.lines.length ? cell.lines : [line('')];
  return `<w:tc>${tcPr}${lines.map(l => docxPara(l.t, l.b, cell.align, 18)).join('')}</w:tc>`;
}

function buildDocxDocumentXml(rows) {
  const widths = docxColWidths();

  const borders = `<w:tblBorders>
    <w:top w:val="single" w:sz="6" w:space="0" w:color="000000"/>
    <w:left w:val="single" w:sz="6" w:space="0" w:color="000000"/>
    <w:bottom w:val="single" w:sz="6" w:space="0" w:color="000000"/>
    <w:right w:val="single" w:sz="6" w:space="0" w:color="000000"/>
    <w:insideH w:val="single" w:sz="6" w:space="0" w:color="000000"/>
    <w:insideV w:val="single" w:sz="6" w:space="0" w:color="000000"/>
  </w:tblBorders>`;

  const grid = '<w:tblGrid>' + widths.map(w => `<w:gridCol w:w="${w}"/>`).join('') + '</w:tblGrid>';

  const headerRow = '<w:tr><w:trPr><w:tblHeader/></w:trPr>' +
    COLS.map((c, i) => docxCell({ lines: [line(c.h, true)], align: 'center' }, widths[i], true)).join('') + '</w:tr>';

  const bodyRows = rows.map(row =>
    '<w:tr>' + row.map((cell, i) => docxCell(cell, widths[i], false)).join('') + '</w:tr>').join('');

  const title = `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="120"/></w:pPr>` +
                docxRun('解送人犯一覽表', true, 36) + '</w:p>';

  const sectPr = `<w:sectPr>
    <w:pgSz w:w="${DOCX_PAGE_W}" w:h="${DOCX_PAGE_H}" w:orient="landscape"/>
    <w:pgMar w:top="${DOCX_MARGIN}" w:right="${DOCX_MARGIN}" w:bottom="${DOCX_MARGIN}" w:left="${DOCX_MARGIN}" w:header="0" w:footer="0" w:gutter="0"/>
  </w:sectPr>`;

  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">
<w:body>
${title}
<w:tbl>
  <w:tblPr><w:tblW w:w="${DOCX_TABLE_W}" w:type="dxa"/>${borders}<w:tblLayout w:type="fixed"/></w:tblPr>
  ${grid}
  ${headerRow}
  ${bodyRows}
</w:tbl>
${sectPr}
</w:body>
</w:document>`;
}

/** 第二階段：把已組好的 document.xml 封裝成 .docx (ZIP) 容器 */
function buildDocxZipFromXml(documentXml) {
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>

  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>

<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>
</Relationships>`;

  return buildZip([
    { name: '[Content_Types].xml', data: utf8(contentTypes) },
    { name: '_rels/.rels',         data: utf8(rels) },
    { name: 'word/document.xml',   data: utf8(documentXml) }
  ]);
}

function buildDocxBlob(rows) {

const ODT_TABLE_W_CM = 27.7;

function odtColWidths() {
  return COLS.map(c => (c.w / COL_WEIGHT_TOTAL * ODT_TABLE_W_CM).toFixed(3));
}

function odtCell(cell, styleName) {
  const paraStyle = cell.align === 'center' ? 'Pc' : 'Pl';
  const lines = cell.lines.length ? cell.lines : [line('')];
  const body = lines.map(l => {
    if (l.t === '') return `<text:p text:style-name="${paraStyle}"/>`;
    const content = l.b ? `<text:span text:style-name="Tb">${escapeXml(l.t)}</text:span>` : escapeXml(l.t);
    return `<text:p text:style-name="${paraStyle}">${content}</text:p>`;
  }).join('');
  return `<table:table-cell table:style-name="${styleName}" office:value-type="string">${body}</table:table-cell>`;
}

function buildOdtContentXml(rows) {
  const widths = odtColWidths();

  const colStyles = widths.map((w, i) =>
    `<style:style style:name="co${i + 1}" style:family="table-column">` +
    `<style:table-column-properties style:column-width="${w}cm"/></style:style>`).join('');

  const colDefs = widths.map((w, i) => `<table:table-column table:style-name="co${i + 1}"/>`).join('');

    COLS.map(c => odtCell({ lines: [line(c.h, true)], align: 'center' }, 'ceH')).join('') +
    '</table:table-row></table:table-header-rows>';

  const bodyRows = rows.map(row =>
    '<table:table-row>' + row.map(cell => odtCell(cell, 'ce1')).join('') + '</table:table-row>').join('');

  return `<?xml version="1.0" encoding="UTF-8"?>
<office:document-content
  xmlns:office="urn:oasis:names:tc:opendocument:xmlns:office:1.0"
  xmlns:style="urn:oasis:names:tc:opendocument:xmlns:style:1.0"
  xmlns:text="urn:oasis:names:tc:opendocument:xmlns:text:1.0"
  xmlns:table="urn:oasis:names:tc:opendocument:xmlns:table:1.0"
  xmlns:fo="urn:oasis:names:tc:opendocument:xmlns:xsl-fo-compatible:1.0"
  office:version="1.2">
<office:automatic-styles>
  <style:style style:name="Ttl" style:family="paragraph">
    <style:paragraph-properties fo:text-align="center" fo:margin-bottom="0.3cm"/>
    <style:text-properties fo:font-size="18pt" fo:font-weight="bold" style:font-name-asian="標楷體"/>
  </style:style>
  <style:style style:name="Pc" style:family="paragraph">
    <style:paragraph-properties fo:text-align="center"/>
    <style:text-properties fo:font-size="9pt" style:font-name-asian="標楷體"/>
  </style:style>
  <style:style style:name="Pl" style:family="paragraph">
    <style:paragraph-properties fo:text-align="start"/>
    <style:text-properties fo:font-size="9pt" style:font-name-asian="標楷體"/>
  </style:style>
  <style:style style:name="Tb" style:family="text">
    <style:text-properties fo:font-weight="bold" style:font-weight-asian="bold"/>
  </style:style>
  <style:style style:name="Tbl" style:family="table">
    <style:table-properties style:width="${ODT_TABLE_W_CM}cm" table:align="margins"/>
  </style:style>
  ${colStyles}
  <style:style style:name="ce1" style:family="table-cell">
    <style:table-cell-properties fo:border="0.5pt solid #000000" fo:padding="0.08cm" style:vertical-align="middle"/>
  </style:style>
  <style:style style:name="ceH" style:family="table-cell">
    <style:table-cell-properties fo:border="0.5pt solid #000000" fo:padding="0.08cm" style:vertical-align="middle" fo:background-color="#f2f2f2"/>
  </style:style>
</office:automatic-styles>
<office:body>
<office:text>
  <text:p text:style-name="Ttl">解送人犯一覽表</text:p>
  <table:table table:name="解送人犯一覽表" table:style-name="Tbl">
    ${colDefs}
    ${headerRow}
    ${bodyRows}
  </table:table>
</office:text>
</office:body>
</office:document-content>`;
}

/** 第二階段：把已組好的 content.xml 封裝成 .odt (ZIP) 容器 */
function buildOdtZipFromContent(contentXml) {
  const manifest = `<?xml version="1.0" encoding="UTF-8"?>
<manifest:manifest xmlns:manifest="urn:oasis:names:tc:opendocument:xmlns:manifest:1.0" manifest:version="1.2">
<manifest:file-entry manifest:full-path="/" manifest:media-type="application/vnd.oasis.opendocument.text"/>

const FORMAT_LABELS = { docx: 'Word 文件 (.docx)', doc: 'Word 97-2003 相容 (.doc)', odt: 'OpenDocument 文件 (.odt)' };

/**
 * 2. 匯出解送人犯一覽表 —— 逐步顯示實際執行情形的進度條。
 * 各階段的百分比與提示文字對應真實正在做的工作（驗證 → 逐人整理資料 →
 * 產生文件內容 → 準備下載），而非單純的假動畫；階段之間輔以極短暫停，
 * 讓文字有機會被使用者看清楚，而非一閃而過。
 */
async function exportDocument() {
  const cards = document.querySelectorAll('.suspect-card');
  if (cards.length === 0) { await showError('請至少新增一位人犯！'); return; }

  // 匯出前的格式檢查維持同步、立即回饋，有錯誤就不進入進度視窗
  recalculateAll();
  const errors = collectErrors();
  if (errors.length > 0) {
    await showError(`有 ${errors.length} 個欄位的時間格式不正確，無法匯出：\n\n` +
                    errors.map(e => '• ' + e.text).join('\n'), '無法匯出');
    errors[0].input.scrollIntoView({ behavior: 'smooth', block: 'center' });
    errors[0].input.focus();
    return;
  }

  const format = document.getElementById('exportFormat').value;
  const year = getBaseYear();
  const n = cards.length;
  const baseName = `解送人犯一覽表(共${n}人)_${new Date().toISOString().slice(0, 10)}`;

  showProgress(`匯出 ${FORMAT_LABELS[format] || format}`);

  try {
    updateProgress(4, '驗證資料格式中…');
    await wait(140);

    // 逐人整理匯出資料：真實的逐筆工作量，每處理完一人就更新一次進度，
    // 並讓瀏覽器有機會重繪，使用者看得到條狀圖確實在往前走。
    const rows = [];
    for (let i = 0; i < n; i++) {
      rows.push(buildExportRowForCard(cards[i], i, year));
      updateProgress(8 + Math.round((i + 1) / n * 55), `整理人犯資料中…（${i + 1}/${n}）`);
      await nextFrame();
    }

    updateProgress(66, `產生 ${format.toUpperCase()} 文件內容中…`);
    await wait(150);

    let blob;
    if (format === 'doc') {
      blob = new Blob(['﻿', buildDocHtml(rows)], { type: 'application/msword' });
    } else if (format === 'docx') {
      updateProgress(78, '組合文件結構 (XML)…');
      await nextFrame();
      const xml = buildDocxDocumentXml(rows); // 真正的階段一：組出 word/document.xml
      updateProgress(88, '封裝為 .docx (ZIP)…');
      await nextFrame();
      blob = new Blob([buildDocxZipFromXml(xml)], // 真正的階段二：封裝成 ZIP 容器
        { type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' });
    } else {
      updateProgress(78, '組合文件結構 (XML)…');
      await nextFrame();
      const xml = buildOdtContentXml(rows); // 真正的階段一：組出 content.xml
      updateProgress(88, '封裝為 .odt (ZIP)…');
      await nextFrame();
      blob = new Blob([buildOdtZipFromContent(xml)], // 真正的階段二：封裝成 ZIP 容器
        { type: 'application/vnd.oasis.opendocument.text' });
    }

    updateProgress(96, '準備下載…');
    await wait(120);

    const filename = baseName + '.' + format;
    downloadBlob(blob, filename);

    document.getElementById('progressFill').classList.add('done');
    updateProgress(100, `完成！已開始下載 ${filename}`);
    await hideProgress(450);

    toast(`已匯出 ${format.toUpperCase()} 檔（共 ${n} 人）`, 'file-down');
  } catch (err) {
    await hideProgress(0);
    await showError('匯出時發生錯誤：' + err.message, '匯出失敗');
    throw err;
  }
}
</script>

</body>
</html>
