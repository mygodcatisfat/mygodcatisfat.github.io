<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>警察逮捕人犯障礙時間計算工具</title>
  <script>
    /* 3. 深色/淺色模式：在 <style> 解析前就決定好 data-theme，避免載入時先閃一下淺色再跳深色 */
    (function() {
      var saved = null;
      try { saved = localStorage.getItem('jsrf-theme'); } catch (e) { /* localStorage 不可用，saved 保持 null */ }
      var theme = (saved === 'dark' || saved === 'light') ? saved
        : ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    :root {
      --primary: #1a365d;
      --primary-text: var(--primary); /* 標題/文字用色；深色模式會改亮，--primary 本身維持深藍當作頁首背景 */
      --primary-light: #2b6cb0;
      --accent: #2c7a7b;
      --bg: #eff3f8;
      --card-bg: #ffffff;
      --line: #cbd5e0;
      --line-soft: #e2e8f0;
      --ink: #1a202c;
      --muted: #5a6b7f;
      --err: #c53030;
      --ok: #276749;
      --warn: #b7791f;
      --radius: 9px;
      --shadow: 0 1px 2px rgba(16, 42, 67, .06), 0 5px 14px rgba(16, 42, 67, .06);
      --header-h: 52px;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      margin: 0;
      padding: 0 0 48px;
      line-height: 1.5;
    }

    /* ---------------- 線條風單色 icon ---------------- */
    .icon {
      width: 1.05em; height: 1.05em; flex: none;
      stroke: currentColor; fill: none;
      stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
      vertical-align: -.16em;
    }
    .icon-lg { width: 1.25em; height: 1.25em; }

    /* ---------------- 頁首 ---------------- */
    .app-header {
      position: sticky; top: 0; z-index: 60;
      background: var(--primary);
      color: #fff;
      border-bottom: 1px solid rgba(255, 255, 255, .12);
    }
    .header-inner {
      display: flex; align-items: center; gap: 12px;
      padding: 6px 16px; width: 100%;
    }
    .app-title { font-size: 1.02rem; font-weight: 700; margin: 0; letter-spacing: .01em; }
    .app-sub { font-size: .71rem; opacity: .7; margin: 0; font-weight: 400; }
    .header-inner .spacer { flex: 1 1 auto; }
    .hbtn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, .3);
      color: #fff; border-radius: 6px;
      padding: 5px 11px; font-size: .81rem; font-weight: 600;
      cursor: pointer; text-decoration: none;
      display: inline-flex; align-items: center; gap: 6px;
      font-family: inherit; white-space: nowrap;
      transition: background .15s, border-color .15s;
    }
    .hbtn:hover { background: rgba(255, 255, 255, .13); border-color: rgba(255, 255, 255, .55); }

    /* 3. 深色/淺色模式切換開關 */
    .theme-switch {
      position: relative; width: 46px; height: 25px; flex: none;
      border-radius: 13px; border: 1px solid rgba(255, 255, 255, .35);
      background: rgba(255, 255, 255, .14); cursor: pointer; padding: 0;
      display: inline-flex; align-items: center;
      transition: background .2s, border-color .2s;
    }
    .theme-switch:hover { border-color: rgba(255, 255, 255, .6); }
    .theme-switch:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .theme-switch .ts-icon {
      position: absolute; top: 50%; width: 13px; height: 13px;
      transform: translateY(-50%); color: rgba(255, 255, 255, .75);
      transition: opacity .2s; pointer-events: none;
    }
    .theme-switch .ts-sun  { left: 5px; }
    .theme-switch .ts-moon { right: 5px; }
    .theme-switch .ts-thumb {
      position: absolute; top: 2px; left: 2px; width: 19px; height: 19px;
      border-radius: 50%; background: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
      transition: transform .22s cubic-bezier(.4, 0, .2, 1);
    }
    .theme-switch[aria-checked="true"] .ts-thumb { transform: translateX(21px); }
    .theme-switch[aria-checked="true"] .ts-moon { opacity: 1; }
    .theme-switch[aria-checked="true"] .ts-sun { opacity: .55; }
    .theme-switch[aria-checked="false"] .ts-sun { opacity: 1; }
    .theme-switch[aria-checked="false"] .ts-moon { opacity: .55; }

    /* ---------------- 版面：主欄 + 右側節點圖 ---------------- */
    .app-body {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 12px 16px 0; width: 100%;
    }
    .main-col { flex: 1 1 auto; min-width: 0; }
    .side-col {
      flex: 0 0 250px; width: 250px;
      position: sticky; top: calc(var(--header-h) + 12px);
      max-height: calc(100vh - var(--header-h) - 24px);
      overflow-y: auto; overflow-x: hidden;
    }
    /* 窄螢幕：工作列改為整段落在人犯卡片下方，功能完全不損失 */
    @media (max-width: 1080px) {
      .app-body { padding: 10px 10px 0; flex-wrap: wrap; }
      .main-col { flex: 1 1 100%; }
      .side-col {
        flex: 1 1 100%; width: 100%;
        position: static; max-height: none; overflow: visible;
      }
    }
    @media (max-width: 640px) {
      .app-body { padding: 8px 8px 0; gap: 0; }
      .header-inner { padding: 6px 10px; gap: 8px; }
      .app-sub { display: none; }
    }

    .panel {
      background: var(--card-bg); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 11px 14px; margin-bottom: 11px;
    }
    @media (max-width: 640px) { .panel { padding: 9px; } }

    .panel-title {
      margin: 0 0 8px; font-size: .87rem; font-weight: 700; color: var(--primary-text);
      display: flex; align-items: center; gap: 6px;
    }

    code {
      background: #edf2f7; padding: 1px 5px; border-radius: 3px;
      font-size: .95em; font-family: "Consolas", "Menlo", monospace;
    }

    /* 單行緊湊提示列 */
    .hint-inline {
      display: flex; align-items: flex-start; gap: 8px;
      font-size: .78rem; color: var(--muted); line-height: 1.6;
      margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line-soft);
    }
    .hint-inline b { color: var(--ink); }
    .hint-inline .sep { color: var(--line); margin: 0 3px; }

    /* ---------------- 工具列 ---------------- */
    .toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    .field-inline {
      display: flex; align-items: center; gap: 6px;
      background: #f2f6fb; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px;
    }
    .field-inline label {
      font-weight: 700; color: var(--primary-text); font-size: .8rem;
      white-space: nowrap; display: flex; align-items: center; gap: 5px;
    }
    .field-inline input { width: 60px; padding: 3px 5px; text-align: center; }
    .toolbar .spacer { flex: 1 1 auto; }

    .btn-mini {
      background: #fff; color: var(--primary-text);
      border: 1px solid var(--line); border-radius: 6px;
      padding: 5px 10px; font-size: .8rem; font-weight: 600;
      cursor: pointer; font-family: inherit; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
      transition: background .15s, border-color .15s, color .15s;
    }
    .btn-mini:hover { background: #f2f6fb; border-color: var(--primary-light); }
    .btn-mini.danger { color: var(--err); }
    .btn-mini.danger:hover { background: #fff5f5; border-color: var(--err); }

    /* ---------------- 人犯卡片 ---------------- */
    .suspect-card {
      background: var(--card-bg);
      border: 1px solid var(--line-soft);
      border-left: 4px solid var(--primary-light);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 0 0 10px; margin-bottom: 11px;
      overflow: hidden;
      transition: height .38s cubic-bezier(.4, 0, .2, 1),
                  margin .38s cubic-bezier(.4, 0, .2, 1),
                  padding .38s cubic-bezier(.4, 0, .2, 1),
                  opacity .26s ease, transform .3s ease,
                  border-color .2s, box-shadow .2s;
    }
    .suspect-card.has-error { border-left-color: var(--err); }
    /* 3. 刪除時「被抽走」，下方卡片平順往上補位 */
    .suspect-card.removing {
      opacity: 0; transform: translateX(-34px) scale(.96);
      pointer-events: none;
    }
    @keyframes cardIn { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: none; } }
    .suspect-card.entering { animation: cardIn .34s cubic-bezier(.4, 0, .2, 1); }
    @keyframes cardFlash {
      0%   { box-shadow: 0 0 0 0 rgba(43, 108, 176, .55), var(--shadow); }
      100% { box-shadow: 0 0 0 14px rgba(43, 108, 176, 0), var(--shadow); }
    }
    .suspect-card.flash { animation: cardFlash 1s ease-out; border-left-color: var(--primary-light); }

    .suspect-header {
      font-size: .9rem; font-weight: 700; color: var(--primary-text);
      background: #eaf0f7; padding: 6px 12px;
      display: flex; justify-content: space-between; align-items: center;
      gap: 8px; flex-wrap: wrap;
    }
    .suspect-header .hdr-actions { display: flex; gap: 6px; flex-wrap: wrap; }

    /* 4. 三個區塊各有專屬色系與外框，一眼就能區分 */
    .card-section {
      margin: 9px 12px 0; border: 1px solid var(--sec-line);
      border-radius: 8px; overflow: hidden; background: var(--card-bg);
    }
    .card-section:last-of-type { margin-bottom: 2px; }
    .sec-person  { --sec: #2c7a7b; --sec-tint: #eef7f7; --sec-line: #bcdcdb; }
    .sec-arrest  { --sec: #975a16; --sec-tint: #fdf5e7; --sec-line: #ecd9ae; }
    .sec-barrier { --sec: #2b6cb0; --sec-tint: #eef3fa; --sec-line: #c3d6ec; }

    .section-label {
      font-size: .76rem; font-weight: 700; color: var(--sec, var(--muted));
      letter-spacing: .03em; margin: 0; padding: 5px 10px;
      background: var(--sec-tint, #f2f6fb);
      border-bottom: 1px solid var(--sec-line, var(--line-soft));
      border-left: 3px solid var(--sec, var(--line));
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
    }
    .section-label .sec-note {
      font-size: .69rem; font-weight: 400; color: var(--muted); letter-spacing: 0;
    }
    .card-body { padding: 9px 10px; }
    @media (max-width: 640px) {
      .card-section { margin: 7px 8px 0; }
      .card-body { padding: 8px; }
    }

    /* 緊湊欄位網格：標籤在上、輸入在下，取代原本高聳的兩列表格 */
    .compact-grid { display: grid; gap: 7px 10px; }
    .cols-4 { grid-template-columns: repeat(4, 1fr); }
    .cols-3 { grid-template-columns: .85fr 1.35fr 1fr; }
    .cfield { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .cfield > .cflabel {
      font-size: .72rem; font-weight: 700; color: var(--primary-text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    @media (max-width: 980px) { .cols-4, .cols-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .cols-4, .cols-3 { grid-template-columns: 1fr; } }

    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }

    table.form-table { width: 100%; border-collapse: collapse; min-width: 540px; }
    table.form-table th, table.form-table td {
      border: 1px solid #bcc8d6; padding: 4px 7px; vertical-align: middle; font-size: .83rem;
    }
    table.form-table th {
      background: #f2f6fb; font-weight: 700; text-align: center;
      white-space: nowrap; color: var(--primary-text);
    }
    table.form-table thead th { background: #e3eaf3; }

    /* 2 + 5. 法定障礙事由：置左、事由與操作鈕分置兩端
       （選擇器需壓過 table.form-table th 的置中設定） */
    table.form-table .barrier-row > th,
    table.form-table .group-row > th {
      text-align: left; white-space: normal; font-weight: 600;
    }
    .rsn { display: flex; align-items: center; gap: 6px; min-height: 26px; }
    .rsn > .rsn-text { flex: 1 1 auto; min-width: 0; }
    .rsn > .reason-input { flex: 1 1 auto; min-width: 0; }
    /* 3. 其他障礙時間的刪除鍵緊貼事由輸入框右側 */
    .rsn > .btn-add, .rsn > .btn-del { flex: none; margin-left: 0; }
    .rsn > .rsn-text + .btn-add, .rsn > .rsn-text + .btn-del { margin-left: auto; }

    /* 每個事由的識別圖示；未填寫的列整體淡化，已填寫的一眼突顯 */
    .rsn-icon { color: var(--primary-light); opacity: .75; flex: none; }
    .barrier-row.is-empty .rsn-text { color: #93a3b5; font-weight: 500; }
    .barrier-row.is-empty .rsn-icon { opacity: .3; }
    .barrier-row.is-filled .rsn-text { color: var(--primary-text); }

    /* 小計：文字下方加上佔比橫條，一眼看出哪個事由影響最大 */
    .row-subtotal .sub-val { display: block; }
    .sub-bar {
      display: block; height: 3px; border-radius: 2px;
      background: #e2e8f0; margin: 3px auto 0; max-width: 120px; overflow: hidden;
    }
    .sub-bar > i { display: block; height: 100%; width: 0; background: var(--primary-light); transition: width .25s ease; }
    .row-subtotal.zero .sub-bar, .row-subtotal.bad .sub-bar { visibility: hidden; }

    /* 交通障礙段號徽章 */
    .seg-badge {
      display: inline-block; margin-left: 5px; padding: 0 6px;
      border-radius: 9px; background: #dbe7f5; color: var(--primary-light);
      font-size: .69rem; font-weight: 700; white-space: nowrap;
    }

    /* 其他障礙時間的群組標題列 */
    .group-row > th {
      background: #e8eff8 !important; color: var(--primary-text);
      font-size: .78rem; padding: 4px 7px !important;
    }

    /* 目前作用中的列highlight，方便對照 */
    .barrier-row > th, .barrier-row > td { transition: background .12s; }
    .barrier-row:hover > td { background: #f7fbff; }
    .barrier-row:focus-within > th { background: #dfeaf8; }
    .barrier-row:focus-within > td { background: #f4f9ff; }

    input[type="text"], select {
      width: 100%; padding: 5px 8px;
      border: 1px solid var(--line); border-radius: 5px;
      font-size: .84rem; font-family: inherit; background: #fff; color: var(--ink);
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]:focus, select:focus {
      outline: none; border-color: var(--primary-light);
      box-shadow: 0 0 0 3px rgba(43, 108, 176, .16);
    }
    /* 1. 提示字調淡，與實際輸入內容明顯區隔 */
    input::placeholder { color: #c2ccd8; opacity: 1; font-weight: 400; }
    input::-ms-input-placeholder { color: #c2ccd8; }
    input.time-input, input.arrest-time-input, input.idno-input {
      font-family: "Consolas", "Menlo", "Courier New", monospace; letter-spacing: .05em;
    }

    input.is-invalid {
      border-color: var(--err) !important; background: #fff5f5;
      box-shadow: 0 0 0 3px rgba(197, 48, 48, .13);
    }
    input.is-pending { border-color: #d69e2e; background: #fffdf5; }
    input.is-valid { border-color: #68d391; }
    .field-msg { font-size: .715rem; line-height: 1.35; margin-top: 2px; display: none; }
    .field-msg.show { display: flex; align-items: flex-start; gap: 4px; }

    /* 障礙時間列：把驗證訊息移到輸入框右側同一行，省下每列一行的高度 */
    .input-line { display: flex; align-items: center; gap: 9px; }
    .input-line > input { flex: 0 1 188px; }
    .input-line > .field-msg { margin-top: 0; flex: 1 1 auto; min-width: 0; }
    @media (max-width: 900px) {
      .input-line { flex-direction: column; align-items: stretch; gap: 2px; }
      .input-line > input { flex: none; }
    }
    .field-msg.err { color: var(--err); font-weight: 700; }
    .field-msg.pending { color: var(--warn); }
    .field-msg.ok { color: var(--ok); }

    .location-box { margin-bottom: 4px; }
    .row-subtotal {
      font-weight: 700; color: var(--primary-text); white-space: nowrap;
      text-align: center; background: #fafcfe;
    }
    .row-subtotal.zero { color: #b6c2d0; font-weight: 400; }
    .row-subtotal.bad { color: var(--err); background: #fff5f5; }

    .btn-add {
      background: #fff; color: var(--ok); border: 1px solid #9ae6b4; border-radius: 5px;
      padding: 4px 9px; font-size: .78rem; cursor: pointer; margin-left: 6px;
      font-weight: 600; white-space: nowrap; font-family: inherit;
      display: inline-flex; align-items: center; gap: 4px; transition: background .15s, color .15s;
    }
    .btn-add:hover { background: var(--ok); color: #fff; border-color: var(--ok); }

    .btn-del {
      background: #fff; color: var(--err); border: 1px solid #feb2b2; border-radius: 5px;
      padding: 3px 8px; font-size: .75rem; cursor: pointer; margin-left: 6px;
      white-space: nowrap; font-weight: 600; font-family: inherit;
      display: inline-flex; align-items: center; gap: 4px; transition: background .15s, color .15s;
    }
    .btn-del:hover { background: var(--err); color: #fff; border-color: var(--err); }

    .btn-copy {
      background: #fff; color: var(--primary-light); border: 1px solid #90cdf4; border-radius: 5px;
      padding: 5px 11px; font-size: .78rem; cursor: pointer; font-weight: 600;
      white-space: nowrap; font-family: inherit;
      display: inline-flex; align-items: center; gap: 5px; transition: background .15s, color .15s;
    }
    .btn-copy:hover { background: var(--primary-light); color: #fff; border-color: var(--primary-light); }

    .btn-add-suspect {
      width: 100%; background: var(--accent); color: #fff; border: none;
      border-radius: var(--radius); padding: 9px; font-size: .9rem; font-weight: 700;
      cursor: pointer; margin-bottom: 11px; font-family: inherit; box-shadow: var(--shadow);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s;
    }
    .btn-add-suspect:hover { background: #285e61; }
    .btn-add-suspect:disabled { background: #cbd5e0; color: #718096; cursor: not-allowed; box-shadow: none; }

    /* 計算結果：改為橫向並排，取代原本兩列的表格 */
    .result-strip { display: flex; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
    .stat {
      flex: 1 1 220px; display: flex; align-items: center; gap: 10px;
      border: 1px solid #a8bacd; border-radius: 7px;
      background: #f5faff; padding: 6px 12px; min-width: 0;
    }
    .stat-label {
      font-size: .76rem; font-weight: 700; color: var(--primary-text);
      white-space: nowrap; flex: none;
    }
    .stat-value { font-size: .95rem; font-weight: 700; margin-left: auto; text-align: right; }
    .stat.deadline { background: #fff7f7; border-color: #e8b4b4; }
    .highlight-text { color: var(--err); }
    .deadline-result:not(.highlight-ready) { font-size: .8rem; font-weight: 600; color: #a0aec0; }

    /* ---------------- 總覽 ---------------- */
    .summary-list { list-style: none; margin: 0; padding: 0; font-size: .8rem; }
    .summary-list li {
      display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
      padding: 3px 0; border-bottom: 1px dashed var(--line-soft);
    }
    .summary-list li:last-child { border-bottom: 0; }
    .sum-no {
      background: #e3eaf3; color: var(--primary-text); border-radius: 4px;
      padding: 0 7px; font-weight: 700; font-size: .75rem; flex: none;
    }
    .sum-deadline { font-weight: 700; color: var(--err); }
    .sum-pending { color: #a0aec0; }

    /* ---------------- 匯出 ---------------- */
    .export-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
    .export-row label { font-size: .85rem; font-weight: 700; color: var(--primary-text); }
    .export-row select { width: auto; min-width: 230px; padding: 7px 9px; }
    .btn-main {
      padding: 8px 18px; border: none; border-radius: 6px; font-size: .9rem;
      font-weight: 700; cursor: pointer; flex: 1 1 230px; font-family: inherit;
      background: #2b579a; color: #fff;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      transition: background .15s;
    }
    .btn-main:hover { background: #1e3d6b; }
    .btn-main:disabled { background: #cbd5e0; color: #718096; cursor: not-allowed; }
    .format-note { font-size: .76rem; color: var(--muted); margin-top: 7px; }

    .error-banner {
      display: none; margin-top: 9px; padding: 9px 12px;
      border: 1px solid var(--err); border-left: 4px solid var(--err);
      border-radius: 7px; background: #fff5f5; color: var(--err);
      font-size: .83rem; line-height: 1.65;
    }
    .error-banner.show { display: block; }
    .error-banner ul { margin: 6px 0 0; padding-left: 20px; }

    .privacy-note {
      margin-top: 9px; padding: 7px 11px; border-radius: 6px;
      background: #fffaf0; border: 1px solid #f0d894; color: #744210;
      font-size: .76rem; line-height: 1.55; display: flex; gap: 7px; align-items: flex-start;
    }

    /* ---------------- 右側節點圖 ---------------- */
    .side-panel {
      background: var(--card-bg); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 10px; margin-bottom: 11px;
    }
    .side-panel:last-child { margin-bottom: 0; }

    /* 右側工作列：年度欄位與各項操作鈕 */
    .rail-year { display: flex; flex-direction: column; gap: 3px; }
    .rail-year label {
      font-size: .73rem; font-weight: 700; color: var(--primary-text);
      display: flex; align-items: center; gap: 5px;
    }
    .rail-year input { width: 100%; text-align: center; }
    .rail-actions {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px;
    }
    .rail-actions .btn-mini { width: 100%; justify-content: center; padding: 6px 4px; }
    .rail-hint {
      margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line-soft);
      font-size: .71rem; line-height: 1.55; color: var(--muted);
    }
    .rail-hint b { color: var(--ink); }
    .rail-hint code { font-size: .92em; padding: 0 3px; }

    /* 右側工作列：匯出區塊改為直式堆疊 */
    .rail-export .export-row { flex-direction: column; align-items: stretch; gap: 7px; }
    .rail-export .export-row label { font-size: .73rem; }
    .rail-export select { width: 100%; min-width: 0; padding: 6px 8px; font-size: .8rem; }
    .rail-export .btn-main { width: 100%; flex: none; font-size: .84rem; padding: 9px 8px; }
    .rail-export .format-note { font-size: .69rem; line-height: 1.5; margin-top: 6px; }
    .rail-export .error-banner { font-size: .71rem; padding: 7px 9px; line-height: 1.5; }
    .rail-export .error-banner ul { padding-left: 15px; }
    .rail-export .privacy-note { font-size: .69rem; line-height: 1.5; padding: 6px 8px; }
    .side-title {
      font-size: .8rem; font-weight: 700; color: var(--primary-text);
      display: flex; align-items: center; gap: 6px; margin-bottom: 8px;
      padding-bottom: 7px; border-bottom: 1px solid var(--line-soft);
    }
    .node-list { list-style: none; margin: 0; padding: 0; position: relative; }
    .node-list::before {
      content: ''; position: absolute; left: 12px; top: 14px; bottom: 14px;
      width: 2px; background: #dbe3ec;
    }
    .node-item {
      position: relative; display: flex; gap: 8px; align-items: center;
      padding: 3px 5px 3px 0; cursor: pointer; border-radius: 6px;
      transition: background .15s;
    }
    .node-item:hover { background: #eff4fa; }
    .node-item.active { background: #e4eefa; }
    .node-item.active .node-dot { box-shadow: 0 0 0 3px rgba(43, 108, 176, .18); }
    .node-dot {
      position: relative; z-index: 1; width: 26px; height: 26px; flex: none;
      border-radius: 50%; background: #fff; border: 2px solid #a0aec0; color: #4a5568;
      display: flex; align-items: center; justify-content: center;
      font-size: .75rem; font-weight: 700; transition: box-shadow .2s, border-color .2s, color .2s;
    }
    .node-item.ok   .node-dot { border-color: #38a169; color: var(--ok); }
    .node-item.warn .node-dot { border-color: #d69e2e; color: #975a16; }
    .node-item.err  .node-dot { border-color: var(--err); color: var(--err); background: #fff5f5; }
    .node-info { min-width: 0; display: flex; flex-direction: column; }
    .node-name {
      font-size: .78rem; font-weight: 600; color: var(--ink); line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .node-meta {
      font-size: .68rem; color: var(--muted); line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .node-item.err .node-meta { color: var(--err); }
    /* 3. 原「總覽」的資料併入節點：障礙總計與滿 16 小時 */
    .node-deadline {
      font-size: .72rem; font-weight: 700; line-height: 1.3;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--err);
    }
    .node-item:not(.ok) .node-deadline { color: #b6c2d0; font-weight: 400; }
    .node-item { padding: 5px 5px 5px 0; }
    .node-add { opacity: .8; }
    .node-add .node-dot { border-style: dashed; border-color: var(--accent); color: var(--accent); }
    .node-add .node-name { color: var(--accent); }
    .node-add.disabled { opacity: .4; cursor: not-allowed; }
    .node-legend {
      margin-top: 8px; padding-top: 7px; border-top: 1px solid var(--line-soft);
      font-size: .68rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px;
    }
    .node-legend span { display: flex; align-items: center; gap: 5px; }
    .lg-dot { width: 8px; height: 8px; border-radius: 50%; border: 2px solid; flex: none; }

    /* ---------------- 彈跳視窗 ---------------- */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(15, 30, 50, .55);
      display: flex; align-items: center; justify-content: center;
      z-index: 9999; padding: 16px; opacity: 0; transition: opacity .15s ease;
    }
    .modal-overlay.show { opacity: 1; }
    .modal {
      background: #fff; border-radius: 12px; width: 100%; max-width: 580px;
      max-height: 86vh; display: flex; flex-direction: column;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35);
      transform: translateY(-10px); transition: transform .15s ease;
    }
    .modal-overlay.show .modal { transform: translateY(0); }
    .modal-header {
      padding: 14px 18px; font-size: 1rem; font-weight: 700; color: var(--primary-text);
      border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 8px;
    }
    .modal-body {
      padding: 16px 18px; font-size: .88rem; line-height: 1.75;
      overflow-y: auto; white-space: pre-wrap; color: var(--ink);
    }
    .modal-body.rich { white-space: normal; }
    .modal-body h4 {
      margin: 16px 0 6px; font-size: .88rem; color: var(--primary-text);
      border-left: 3px solid var(--primary-light); padding-left: 8px;
    }
    .modal-body h4:first-child { margin-top: 0; }
    .modal-body ul { margin: 0; padding-left: 20px; }
    .modal-body li { margin-bottom: 3px; }
    .modal-footer {
      padding: 12px 18px; border-top: 1px solid var(--line-soft);
      display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap;
    }
    .modal-btn {
      padding: 9px 18px; border-radius: 7px; border: 1px solid var(--line);
      background: #fff; color: var(--ink); font-size: .88rem; font-weight: 600;
      cursor: pointer; font-family: inherit; min-width: 86px;
    }
    .modal-btn:hover { background: #f2f6fb; }
    .modal-btn.primary { background: var(--primary-light); border-color: var(--primary-light); color: #fff; }
    .modal-btn.primary:hover { background: var(--primary); }
    .modal-btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
    .modal-btn.danger:hover { background: #9b2c2c; }
    .modal-btn:focus-visible { outline: 3px solid rgba(43, 108, 176, .4); outline-offset: 2px; }

    /* ---------------- 2. 匯出進度視窗 ---------------- */
    .progress-overlay {
      position: fixed; inset: 0; background: rgba(15, 30, 50, .55);
      display: flex; align-items: center; justify-content: center;
      z-index: 9998; padding: 16px; opacity: 0; transition: opacity .15s ease;
    }
    .progress-overlay.show { opacity: 1; }
    .progress-modal {
      background: var(--card-bg); border-radius: 12px; width: 100%; max-width: 380px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, .35); padding: 20px 22px;
      transform: translateY(-10px); transition: transform .15s ease;
    }
    .progress-overlay.show .progress-modal { transform: translateY(0); }
    .progress-title {
      font-size: .95rem; font-weight: 700; color: var(--primary-text);
      display: flex; align-items: center; gap: 8px; margin-bottom: 14px;
    }
    .progress-title .icon { animation: spin 1.1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .progress-track {
      width: 100%; height: 8px; border-radius: 5px; background: var(--line-soft);
      overflow: hidden; position: relative;
    }
    .progress-fill {
      height: 100%; width: 0%; border-radius: 5px;
      background: linear-gradient(90deg, var(--primary-light), var(--accent));
      transition: width .25s ease;
    }
    .progress-fill.done { background: var(--ok); }
    .progress-meta {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-top: 9px; gap: 8px;
    }
    .progress-stage {
      font-size: .8rem; color: var(--muted); flex: 1 1 auto; min-width: 0;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .progress-pct { font-size: .82rem; font-weight: 700; color: var(--primary-text); flex: none; }

    /* ---------------- 浮動提示 ---------------- */
    .toast-wrap {
      position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
      z-index: 10000; display: flex; flex-direction: column; gap: 8px;
      align-items: center; pointer-events: none;
    }
    .toast {
      background: var(--primary); color: #fff; padding: 10px 16px; border-radius: 8px;
      font-size: .85rem; font-weight: 600; display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 26px rgba(0, 0, 0, .28);
      animation: toastIn .24s cubic-bezier(.4, 0, .2, 1);
      transition: opacity .25s ease, transform .25s ease;
    }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    .toast.out { opacity: 0; transform: translateY(12px); }

    .back-top {
      position: fixed; right: 20px; bottom: 20px; z-index: 55;
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--primary); color: #fff; border: none; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
    }
    .back-top.show { display: flex; }
    @media (min-width: 1081px) { .back-top { right: 278px; } }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    /* =====================================================================
       3. 深色模式
       ---------------------------------------------------------------------
       --primary（#1a365d）刻意維持不變 —— 它只用來當頁首/浮動提示/回頂端
       這幾個「navy 色塊」的背景色，在深色頁面上仍然清楚可辨。真正需要隨主題
       變亮的文字改用 --primary-text（已在對應規則中把原本的
       color:var(--primary) 全部換成 color:var(--primary-text)）。
       其餘規則中大量使用「淺色調背景 + 深色文字」的字面色碼（表格底色、
       輸入框、提示框、節點圖…），在此統一覆寫為深色對應版本。
       ===================================================================== */
    :root[data-theme="dark"] {
      --primary-text: #7fb0e8;
      --primary-light: #5b9fe0;
      --accent: #3fb6ae;
      --bg: #0b1119;
      --card-bg: #151e2c;
      --line: #33455c;
      --line-soft: #243144;
      --ink: #e2e8f0;
      --muted: #8b98ab;
      --err: #f56565;
      --ok: #48bb78;
      --warn: #ecc94b;
    }

    :root[data-theme="dark"] code { background: #212d3d; }
    :root[data-theme="dark"] .field-inline { background: #182234; }
    :root[data-theme="dark"] .btn-mini { background: #151e2c; }
    :root[data-theme="dark"] .btn-mini:hover { background: #1c2940; }
    :root[data-theme="dark"] .btn-mini.danger:hover { background: #3a1f22; }
    :root[data-theme="dark"] .suspect-header { background: #1c2740; }

    :root[data-theme="dark"] .sec-person  { --sec: #5fd0c9; --sec-tint: #142826; --sec-line: #2a4c49; }
    :root[data-theme="dark"] .sec-arrest  { --sec: #f0b45e; --sec-tint: #2c2211; --sec-line: #503d1c; }
    :root[data-theme="dark"] .sec-barrier { --sec: #7fb0e8; --sec-tint: #172236; --sec-line: #2b4260; }

    :root[data-theme="dark"] table.form-table th,
    :root[data-theme="dark"] table.form-table td { border-color: #33455c; }
    :root[data-theme="dark"] table.form-table th { background: #182234; }
    :root[data-theme="dark"] table.form-table thead th { background: #1f2c42; }

    :root[data-theme="dark"] .barrier-row.is-empty .rsn-text { color: #64748b; }
    :root[data-theme="dark"] .sub-bar { background: #253449; }
    :root[data-theme="dark"] .seg-badge { background: #1f3a5c; }
    :root[data-theme="dark"] .group-row > th { background: #1c2940 !important; }
    :root[data-theme="dark"] .barrier-row:hover > td { background: #182234; }
    :root[data-theme="dark"] .barrier-row:focus-within > th { background: #20304a; }
    :root[data-theme="dark"] .barrier-row:focus-within > td { background: #1b2a40; }

    :root[data-theme="dark"] input[type="text"],
    :root[data-theme="dark"] select { background: #101826; color: var(--ink); }
    :root[data-theme="dark"] input::placeholder { color: #4a5a70; }
    :root[data-theme="dark"] input::-ms-input-placeholder { color: #4a5a70; }
    :root[data-theme="dark"] input.is-invalid { background: #34191c; }
    :root[data-theme="dark"] input.is-pending { background: #2e2712; }

    :root[data-theme="dark"] .row-subtotal { background: #131c29; }
    :root[data-theme="dark"] .row-subtotal.zero { color: #5b6b80; }
    :root[data-theme="dark"] .row-subtotal.bad { background: #34191c; }

    :root[data-theme="dark"] .btn-add,
    :root[data-theme="dark"] .btn-del,
    :root[data-theme="dark"] .btn-copy,
    :root[data-theme="dark"] .modal-btn { background: #151e2c; }
    :root[data-theme="dark"] .modal-btn:hover { background: #1c2940; }
    :root[data-theme="dark"] .btn-add-suspect:disabled { background: #263248; color: #8b98ab; }

    :root[data-theme="dark"] .stat { border-color: #33455c; background: #121b28; }
    :root[data-theme="dark"] .stat.deadline { background: #2c1a1c; border-color: #5c3438; }
    :root[data-theme="dark"] .deadline-result:not(.highlight-ready) { color: #64748b; }
    :root[data-theme="dark"] .sum-no { background: #1f2c42; }

    :root[data-theme="dark"] .error-banner { background: #2c1a1c; }
    :root[data-theme="dark"] .privacy-note { background: #2c2410; border-color: #4f3f1a; color: #ecd487; }

    :root[data-theme="dark"] .node-list::before { background: #2c3b4f; }
    :root[data-theme="dark"] .node-item:hover { background: #182234; }
    :root[data-theme="dark"] .node-item.active { background: #1c2c42; }
    :root[data-theme="dark"] .node-dot { background: #101826; border-color: #4a5a70; color: #9aa8bb; }
    :root[data-theme="dark"] .node-item.ok .node-dot { border-color: #48bb78; }
    :root[data-theme="dark"] .node-item.warn .node-dot { border-color: #ecc94b; color: #ecc94b; }
    :root[data-theme="dark"] .node-item.err .node-dot { background: #2c1a1c; }

    :root[data-theme="dark"] .modal,
    :root[data-theme="dark"] .progress-modal { background: #151e2c; }
    :root[data-theme="dark"] .modal-overlay { background: rgba(0, 0, 0, .65); }
    :root[data-theme="dark"] .progress-overlay { background: rgba(0, 0, 0, .65); }
  </style>
</head>
<body>

<header class="app-header">
  <div class="header-inner">
    <div>
      <h1 class="app-title">解送人犯一覽表計算系統</h1>
      <p class="app-sub">法定障礙時間計算 ‧ 滿 16 小時期限推算 ‧ 一覽表匯出</p>
    </div>
    <span class="spacer"></span>
    <button type="button" class="theme-switch" id="themeToggle" role="switch" aria-checked="false"
            title="切換深色／淺色模式" onclick="toggleTheme()">
      <i data-icon="sun" class="ts-icon ts-sun"></i>
      <i data-icon="moon" class="ts-icon ts-moon"></i>
      <span class="ts-thumb"></span>
    </button>
    <button type="button" class="hbtn" onclick="showHelp()"><i data-icon="book"></i> 功能說明</button>
    <a class="hbtn" href="https://mygodcatisfat.github.io" target="_blank" rel="noopener"><i data-icon="home"></i> 回到首頁</a>
  </div>
</header>

<div class="app-body">

  <main class="main-col">

    <div id="suspectCardsContainer"></div>

    <button type="button" id="addSuspectBtn" class="btn-add-suspect" onclick="addNewSuspectCard()">
      <i data-icon="plus"></i> <span id="addSuspectLabel">新增人犯 (最多 10 人)</span>
    </button>

  </main>

  <aside class="side-col">

    <!-- 5. 原本的工具列面板，置於節點圖上方 -->
    <div class="side-panel">
      <div class="rail-year">
        <label for="baseYear"><i data-icon="calendar"></i> 案件年度 (西元)</label>
        <input type="text" id="baseYear" maxlength="4" inputmode="numeric">
      </div>
      <div class="rail-actions">
        <button type="button" class="btn-mini" onclick="fillSampleData()"><i data-icon="file-text"></i> 填入範例</button>
        <button type="button" class="btn-mini" onclick="document.getElementById('importFile').click()"><i data-icon="import"></i> 匯入 JSON</button>
        <button type="button" class="btn-mini danger" onclick="clearAll()"><i data-icon="trash"></i> 清除全部</button>
        <button type="button" class="btn-mini" onclick="exportJson()"><i data-icon="export"></i> 匯出 JSON</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
      </div>
      <div class="rail-hint">
        <b>逮捕時間</b> <code>MMDDhhmm</code>（8 碼）<br>
        <b>障礙時間</b> <code>MMDDhhmm-MMDDhhmm</code>（17 碼，打滿 8 碼自動補「-」）<br>
        跨年案件 (12月→1月) 會自動跨年計算。詳見右上「功能說明」。
      </div>
    </div>

    <!-- 3. 節點圖，內含原「總覽」的障礙總計與滿 16 小時 -->
    <div class="side-panel">
      <div class="side-title"><i data-icon="nodes"></i> 人犯節點圖</div>
      <ol class="node-list" id="nodeList"></ol>
      <div class="node-legend">
        <span><i class="lg-dot" style="border-color:#38a169;"></i> 已完成計算</span>
        <span><i class="lg-dot" style="border-color:#d69e2e;"></i> 尚未填寫逮捕時間</span>
        <span><i class="lg-dot" style="border-color:#c53030;"></i> 有格式錯誤</span>
      </div>
    </div>

    <!-- 4. 匯出一覽表，置於節點圖下方 -->
    <div class="side-panel rail-export">
      <div class="side-title"><i data-icon="file-down"></i> 匯出一覽表</div>
      <div class="export-row">
        <label for="exportFormat">匯出格式</label>
        <select id="exportFormat">
          <option value="docx">Word 文件 (.docx)</option>
          <option value="doc">Word 97-2003 相容 (.doc)</option>
          <option value="odt">OpenDocument 文件 (.odt)</option>
        </select>
        <button class="btn-main" id="exportBtn" onclick="exportDocument()">
          <i data-icon="file-down"></i> 匯出解送人犯一覽表
        </button>
      </div>
      <div class="format-note" id="formatNote"></div>
      <div class="error-banner" id="errorBanner"></div>
      <div class="privacy-note">
        <i data-icon="lock" class="icon-lg"></i>
        <span>所有計算都在本機完成，不會上傳資料。內容暫存於本機瀏覽器，公用電腦用畢請按「清除全部」。</span>
      </div>
    </div>

  </aside>

</div>

<button type="button" class="back-top" id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})" title="回到頂端">
  <i data-icon="arrow-up" class="icon-lg"></i>
</button>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer" id="modalFooter"></div>
  </div>
</div>

<!-- 2. 匯出進度視窗（獨立於確認彈窗，不受 Esc / 背景點擊關閉影響，匯出中不可中斷） -->
<div class="progress-overlay" id="progressOverlay" hidden>
  <div class="progress-modal" role="status" aria-live="polite">
    <div class="progress-title"><i data-icon="file-down" class="icon-lg"></i> <span id="progressTitle">匯出中…</span></div>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-meta">
      <span class="progress-stage" id="progressStage">準備中…</span>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
  </div>
</div>

<div class="toast-wrap" id="toastWrap"></div>

<script>
/* =========================================================================
   單色線條 icon（stroke 使用 currentColor，隨文字顏色變化）
   ========================================================================= */
const ICONS = {
  home:      '<path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.8 10v9.4a1.1 1.1 0 0 0 1.1 1.1h3.3v-5.6h3.6v5.6h3.3a1.1 1.1 0 0 0 1.1-1.1V10"/>',

function iconSvg(name, cls) {
  return `<svg class="icon ${cls || ''}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

/** 把 <i data-icon="xxx"> 佔位符換成實際 SVG
 *  注意：要以「class token」為單位過濾，不能用字串 replace，
 *  否則 rsn-icon / icon-lg 這類名稱會被截斷 */
function renderIcons(root) {
  (root || document).querySelectorAll('i[data-icon]').forEach(el => {
    const n = el.getAttribute('data-icon');
    if (!ICONS[n]) return;
    const extra = (el.className || '').split(/\s+/).filter(c => c && c !== 'icon').join(' ');
    el.outerHTML = iconSvg(n, extra);
  });
}

/* =========================================================================
   效能優化：全域重算（節點圖 + 匯出可用性 + 暫存）以 rAF 合併
   ---------------------------------------------------------------------
   單一欄位變動只需重畫「該欄位所在的那張卡片」；節點圖與匯出檢查是
   O(n) 的全域工作，若每個按鍵都同步重跑，10 人時會變成連續的
   O(n²)（尤其匯入/還原時逐一新增卡片，每次都重建整份節點圖）。
   這裡把這兩件事＋本機暫存寫入合併到「每個畫面影格最多跑一次」，
   按鍵手感不變，但同一影格內的多次變動只會計算一次。
   結構性操作（新增/刪除人犯、複製、匯入、清除…）改呼叫
   flushGlobalUpdate()，確保回傳當下 DOM／節點圖已同步、可立即讀取。
   ========================================================================= */
let _rafHandle = null;
function scheduleGlobalUpdate() {
  if (_rafHandle !== null) return;
  _rafHandle = requestAnimationFrame(() => {
    _rafHandle = null;
    updateExportAvailability();
    buildNodeMap();
    saveState();
  });
}
function flushGlobalUpdate() {
  if (_rafHandle !== null) { cancelAnimationFrame(_rafHandle); _rafHandle = null; }
  updateExportAvailability();
  buildNodeMap();
  saveState();
}
window.addEventListener('beforeunload', flushGlobalUpdate);

const THEME_KEY = 'jsrf-theme';

function syncThemeSwitch() {
  const btn = document.getElementById('themeToggle');
  if (!btn) return;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  btn.setAttribute('aria-checked', isDark ? 'true' : 'false');
}

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  const next = isDark ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  syncThemeSwitch();
  try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
}

window.onload = function() {
  renderIcons();
  syncThemeSwitch();
  document.documentElement.style.setProperty('--header-h',
    document.querySelector('.app-header').offsetHeight + 'px');

  document.getElementById('baseYear').value = new Date().getFullYear();
  document.getElementById('baseYear').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 4);
    recalculateAll(); // 年度影響所有人犯的計算，需立即同步重算（內含 flushGlobalUpdate，已含存檔)
  });
  document.getElementById('exportFormat').addEventListener('change', updateFormatNote);
  document.getElementById('importFile').addEventListener('change', handleImportFile);
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && !document.getElementById('modalOverlay').hidden) { closeModal(false); return; }
    // Enter 直接跳到同一位人犯的下一個時間欄位，連續輸入不用一直點滑鼠
    if (e.key === 'Enter' && e.target && e.target.classList &&
        (e.target.classList.contains('time-input') || e.target.classList.contains('arrest-time-input'))) {
      e.preventDefault();
      const card = e.target.closest('.suspect-card');
      if (!card) return;
      const fields = Array.from(card.querySelectorAll('.arrest-time-input, .time-input'));
      const i = fields.indexOf(e.target);
      if (i > -1 && i < fields.length - 1) fields[i + 1].focus();
      else e.target.blur();
    }
  });
  document.getElementById('modalOverlay').addEventListener('mousedown', function(e) {
    if (e.target === this) closeModal(false);
  });
  window.addEventListener('scroll', function() {
    document.getElementById('backTop').classList.toggle('show', window.pageYOffset > 400);
  }, { passive: true });

  updateFormatNote();
  if (!restoreState()) addNewSuspectCard();
  recalculateAll();
};

function updateFormatNote() {
  document.getElementById('formatNote').innerText =

function getBaseYear() {
  const v = parseInt(document.getElementById('baseYear').value, 10);
  return (v >= 1912 && v <= 9999) ? v : new Date().getFullYear();
}

let modalResolve = null;

function showModal(opts) {
  return new Promise(resolve => {
    if (modalResolve) { const r = modalResolve; modalResolve = null; r(undefined); }
    modalResolve = resolve;

    const overlay = document.getElementById('modalOverlay');
    document.getElementById('modalTitle').innerHTML =
      (opts.icon ? iconSvg(opts.icon, 'icon-lg') : '') + escapeHtml(opts.title || '訊息');

    const body = document.getElementById('modalBody');
    body.className = 'modal-body' + (opts.html ? ' rich' : '');
    if (opts.html) body.innerHTML = opts.html; else body.innerText = opts.message || '';
    body.scrollTop = 0;

    const footer = document.getElementById('modalFooter');
    footer.innerHTML = '';
    (opts.buttons || [{ label: '確定', value: true, primary: true }]).forEach(b => {
      const btn = document.createElement('button');
      btn.className = 'modal-btn' + (b.primary ? ' primary' : '') + (b.danger ? ' danger' : '');
      btn.innerText = b.label;
      btn.addEventListener('click', () => closeModal(b.value));
      footer.appendChild(btn);
    });

    overlay.hidden = false;
    requestAnimationFrame(() => overlay.classList.add('show'));
    setTimeout(() => {
      const f = footer.querySelector('.primary, .danger') || footer.querySelector('button');
      if (f) f.focus();
    }, 40);
  });
}

function closeModal(value) {
  const overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('show');
  overlay.hidden = true;
  if (modalResolve) { const r = modalResolve; modalResolve = null; r(value); }
}

function showAlert(message, title, iconName) {
  return showModal({ title: title || '提示', icon: iconName || 'info', message: message,
    buttons: [{ label: '確定', value: true, primary: true }] });
}
function showError(message, title) {
  return showModal({ title: title || '無法完成', icon: 'alert', message: message,
    buttons: [{ label: '我知道了', value: true, primary: true }] });
}
function showConfirm(message, title, okLabel) {
  return showModal({ title: title || '請確認', icon: 'help', message: message,
    buttons: [{ label: '取消', value: false }, { label: okLabel || '確定', value: true, danger: true }] });
}

/** 非阻斷式浮動提示 */
function toast(message, iconName) {
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = iconSvg(iconName || 'check', 'icon-lg') + '<span></span>';
  el.querySelector('span').innerText = message;
  wrap.appendChild(el);
  setTimeout(() => {
    el.classList.add('out');
    setTimeout(() => el.remove(), 280);
  }, 2400);
}

/* =========================================================================
   時間解析與格式驗證
   ========================================================================= */

function daysInMonth(year, month) { return new Date(year, month, 0).getDate(); }

function validateSingleTime(str, year) {
  const s = (str || '').trim();
  if (s === '') return { empty: true, ok: true, msg: '', date: null };

  if (!/^\d{8}$/.test(s)) {
    return { empty: false, ok: false, date: null,
      msg: `格式須為 MMDDhhmm 共 8 碼數字 (目前 ${s.replace(/\D/g, '').length} 碼)` };
  }

  const MM = parseInt(s.substring(0, 2), 10);
  const DD = parseInt(s.substring(2, 4), 10);
  const HH = parseInt(s.substring(4, 6), 10);
  const mm = parseInt(s.substring(6, 8), 10);

  if (MM < 1 || MM > 12) return { empty: false, ok: false, date: null, msg: `月份「${s.substring(0,2)}」無效，須為 01–12` };
  const maxDay = daysInMonth(year, MM);
  if (DD < 1 || DD > maxDay) return { empty: false, ok: false, date: null, msg: `${year} 年 ${MM} 月只有 ${maxDay} 天，日期「${s.substring(2,4)}」無效` };
  if (HH > 23) return { empty: false, ok: false, date: null, msg: `小時「${s.substring(4,6)}」無效，須為 00–23` };
  if (mm > 59) return { empty: false, ok: false, date: null, msg: `分鐘「${s.substring(6,8)}」無效，須為 00–59` };

  return { empty: false, ok: true, msg: '', date: new Date(year, MM - 1, DD, HH, mm) };
}

function validateTimeRange(str, year) {
  const s = (str || '').trim();
  if (s === '') return { empty: true, ok: true, msg: '', minutes: 0, start: null, end: null, crossYear: false };

  if (!/^\d{8}-\d{8}$/.test(s)) {
    return { empty: false, ok: false, minutes: 0, start: null, end: null, crossYear: false,
      msg: `格式須為 MMDDhhmm-MMDDhhmm 共 17 碼 (目前 ${s.replace(/\D/g, '').length} 碼數字)` };
  }

  const a = validateSingleTime(s.substring(0, 8), year);
  if (!a.ok) return { empty: false, ok: false, minutes: 0, start: null, end: null, crossYear: false, msg: '開始時間：' + a.msg };

  const b = validateSingleTime(s.substring(9, 17), year);
  if (!b.ok) return { empty: false, ok: false, minutes: 0, start: null, end: null, crossYear: false, msg: '結束時間：' + b.msg };

  let startDate = a.date, endDate = b.date, crossYear = false;

  if (endDate <= startDate && startDate.getMonth() === 11 && endDate.getMonth() === 0) {
    endDate = new Date(endDate.getTime());
    endDate.setFullYear(endDate.getFullYear() + 1);
    crossYear = true;
  }

  if (endDate <= startDate) {
    return { empty: false, ok: false, minutes: 0, start: startDate, end: endDate, crossYear: false,
      msg: '結束時間須晚於開始時間，請確認前後順序' };
  }

  return { empty: false, ok: true, msg: '',
    minutes: Math.floor((endDate - startDate) / 60000), start: startDate, end: endDate, crossYear: crossYear };
}

function isPartialRange(s) { return /^\d{1,8}-?\d{0,7}$/.test((s || '').trim()); }

function formatMinutes(mins) {
  const hrs = Math.floor(mins / 60), remMins = mins % 60;
  if (hrs === 0 && remMins === 0) return '0 小時 0 分';
  if (hrs === 0) return `${remMins} 分`;
  return `${hrs} 小時 ${remMins} 分`;
}

function rocParts(dateObj) {
  if (!dateObj) return null;
  return {
    date: `${dateObj.getFullYear() - 1911}/${String(dateObj.getMonth() + 1).padStart(2, '0')}/${String(dateObj.getDate()).padStart(2, '0')}`,
    time: `${String(dateObj.getHours()).padStart(2, '0')}:${String(dateObj.getMinutes()).padStart(2, '0')}`
  };
}
function rocDateTimeText(d) { const p = rocParts(d); return p ? `${p.date} ${p.time}` : ''; }
function rangeText(res) {
  if (!res || !res.ok || res.empty) return '';
  return `${rocDateTimeText(res.start)} - ${rocDateTimeText(res.end)}`;
}

/* =========================================================================
   輸入遮罩
   ========================================================================= */

function maskRangeInput(input, ev) {
  const deleting = !!(ev && typeof ev.inputType === 'string' && ev.inputType.indexOf('delete') === 0);
  const oldVal = input.value;
  const pos = input.selectionStart === null ? oldVal.length : input.selectionStart;
  const digitsBefore = oldVal.slice(0, pos).replace(/\D/g, '').length;

  const d = oldVal.replace(/\D/g, '').slice(0, 16);
  let newVal;
  if (d.length > 8) newVal = d.slice(0, 8) + '-' + d.slice(8);
  else if (d.length === 8 && !deleting) newVal = d + '-';
  else newVal = d;

  if (newVal === oldVal) return;
  input.value = newVal;

  let counted = 0, i = 0;
  for (; i < newVal.length && counted < digitsBefore; i++) if (/\d/.test(newVal[i])) counted++;
  if (counted === 8 && i === 8 && newVal.length === 9) i = 9;
  try { input.setSelectionRange(i, i); } catch (e) {}
}

function maskSingleInput(input) {
  const oldVal = input.value;
  const pos = input.selectionStart === null ? oldVal.length : input.selectionStart;
  const newVal = oldVal.replace(/\D/g, '').slice(0, 8);
  if (newVal === oldVal) return;
  input.value = newVal;
  const c = Math.min(pos, newVal.length);
  try { input.setSelectionRange(c, c); } catch (e) {}
}

// 三者都會（透過 calculateSuspectTotal 或直接）以 scheduleGlobalUpdate() 合併節點圖／匯出檢查／存檔，
// 讓連續輸入時每個影格只做一次全域重算，而非每個按鍵都做。
function onRangeInput(input, cardId, ev) { maskRangeInput(input, ev); calculateSuspectTotal(cardId); }
function onArrestInput(input, cardId) { maskSingleInput(input); calculateSuspectTotal(cardId); }
function onFieldInput(cardId) { scheduleGlobalUpdate(); }

function onIdInput(input) {
  const pos = input.selectionStart;
  const up = input.value.toUpperCase();
  if (up !== input.value) { input.value = up; try { input.setSelectionRange(pos, pos); } catch (e) {} }
  scheduleGlobalUpdate();
}

/** 3. 刪除動畫：卡片被抽走，下方卡片平順往上補位 */
function animateRemoveCard(card, done) {
  const h = card.offsetHeight;
  card.style.height = h + 'px';
  card.style.overflow = 'hidden';
  void card.offsetHeight;                 // 強制 reflow，讓高度動畫生效
  card.classList.add('removing');
  card.style.height = '0px';
  card.style.marginBottom = '0px';
  card.style.paddingTop = '0px';
  card.style.paddingBottom = '0px';
  setTimeout(() => { card.remove(); if (done) done(); }, 400);
}

async function removeSuspectCard(btn) {
  const card = btn.closest('.suspect-card');
  const title = card.querySelector('.suspect-title').innerText;
  const ok = await showConfirm(`確定要刪除「${title}」嗎？\n此動作無法復原。`, '刪除人犯', '刪除');
  if (!ok) return;

  animateRemoveCard(card, () => {
    reindexSuspectCards();
    recalculateAll(); // 內含 flushGlobalUpdate，已同步存檔
    observeCards();
    toast('已刪除該筆人犯資料', 'trash');
  });
}

/** 5. 複製「上一個人犯」的案件資料（不含人別資料） */
async function copyFromPrevious(btn) {
  const card = btn.closest('.suspect-card');
  const cards = Array.from(document.querySelectorAll('.suspect-card'));
  const idx = cards.indexOf(card);
  if (idx <= 0) return;

  const prev = collectCardData(cards[idx - 1]);
  PERSONAL_FIELDS.forEach(f => { delete prev[f]; });   // 人別資料不複製

  const cur = collectCardData(card);
  const hasCaseData =
    [cur.arrestTime, cur.arrestLoc, cur.lawyer, cur.lawyerWait, cur.lawyerInterview, cur.nightStop]
      .some(v => (v || '').trim()) ||
    cur.traffic.some(t => (t.loc || '').trim() || (t.time || '').trim()) ||
    cur.other.length > 0;

  if (hasCaseData) {
    const ok = await showConfirm(
      `將以【編號 ${idx}】的逮捕資訊與各項障礙時間覆蓋目前【編號 ${idx + 1}】的內容。\n\n` +
      `人別資料（姓名、出生日期、身分證號、戶籍地址）不會被覆蓋。\n\n是否繼續？`,
      '複製上一個人犯資料（不含人別資料）', '覆蓋');
    if (!ok) return;
  }

  applyCaseDataToCard(card, prev);
  toast(`已複製【編號 ${idx}】的案件資料`, 'copy');
}

/** 清掉卡片的案件欄位（保留人別資料） */
function resetCardCaseFields(card) {
  card.querySelector('.arrest-time-input').value = '';
  card.querySelector('.arrest-location-input').value = '';
  card.querySelector('.lawyer-input').value = '';
  card.querySelector('.barrier-row[data-type="lawyerWait"] .time-input').value = '';
  card.querySelector('.barrier-row[data-type="lawyerInterview"] .time-input').value = '';
  card.querySelector('.barrier-row[data-type="nightStop"] .time-input').value = '';
  card.querySelectorAll('.barrier-row[data-type="other"]').forEach(r => r.remove());
  card.querySelectorAll('.barrier-row[data-type="traffic"]').forEach((r, i) => {
    if (i > 0) { r.remove(); return; }
    r.querySelector('.loc-input').value = '';
    r.querySelector('.time-input').value = '';
  });
}

function applyCaseDataToCard(card, d) {
  const id = parseInt(card.getAttribute('data-card-id'), 10);
  resetCardCaseFields(card);

  card.querySelector('.arrest-time-input').value = d.arrestTime || '';
  card.querySelector('.arrest-location-input').value = d.arrestLoc || '';
  card.querySelector('.lawyer-input').value = d.lawyer || '';
  card.querySelector('.barrier-row[data-type="lawyerWait"] .time-input').value = d.lawyerWait || '';
  card.querySelector('.barrier-row[data-type="lawyerInterview"] .time-input').value = d.lawyerInterview || '';
  card.querySelector('.barrier-row[data-type="nightStop"] .time-input').value = d.nightStop || '';

  const trafficList = d.traffic || [];
  if (trafficList.length > 0) {
    const first = card.querySelector('.barrier-row[data-type="traffic"]');
    first.querySelector('.loc-input').value = trafficList[0].loc || '';
    first.querySelector('.time-input').value = trafficList[0].time || '';
    for (let i = 1; i < trafficList.length; i++) addTrafficRow(id, trafficList[i]);
  }
  (d.other || []).forEach(o => addOtherRow(id, o));

  renumberTrafficRows(card);
  calculateSuspectTotal(id);
  flushGlobalUpdate();

  card.classList.add('flash');
  setTimeout(() => card.classList.remove('flash'), 1000);
}

function reindexSuspectCards() {
  const cards = document.querySelectorAll('.suspect-card');
  cards.forEach((card, idx) => {
    const titleSpan = card.querySelector('.suspect-title');
    if (titleSpan) titleSpan.innerText = `【編號 ${idx + 1}】人犯時間與地點資料`;
    // 編號 1 沒有「上一個」，不顯示複製鈕
    const copyBtn = card.querySelector('.btn-copy');
    if (copyBtn) copyBtn.hidden = (idx === 0);
    const delBtn = card.querySelector('.delete-suspect-btn');
    if (delBtn) delBtn.hidden = (cards.length <= 1);
  });

  const btn = document.getElementById('addSuspectBtn');
  btn.disabled = cards.length >= 10;
  document.getElementById('addSuspectLabel').innerText = cards.length >= 10
    ? '已達上限 10 人'
    : `新增人犯 (目前 ${cards.length} 人，最多 10 人)`;

  scheduleGlobalUpdate();
}

/* =========================================================================
   計算與驗證顯示
   ========================================================================= */

function setFieldState(input, state, message) {
  const msgEl = input.parentElement.querySelector('.field-msg');
  input.classList.remove('is-invalid', 'is-valid', 'is-pending');
  if (state === 'err') input.classList.add('is-invalid');
  else if (state === 'ok') input.classList.add('is-valid');
  else if (state === 'pending') input.classList.add('is-pending');

  if (!msgEl) return;
  msgEl.className = 'field-msg';
  if (message) {
    msgEl.classList.add('show', state === 'err' ? 'err' : (state === 'pending' ? 'pending' : 'ok'));
    msgEl.innerHTML = (state === 'err' ? iconSvg('alert') : '') + '<span></span>';
    msgEl.querySelector('span').innerText = message;
  } else {
    msgEl.innerHTML = '';
  }
}

function calculateSuspectTotal(cardId) {
  const card = document.querySelector(`.suspect-card[data-card-id="${cardId}"]`);
  if (!card) return;

  const year = getBaseYear();
  let totalMinutes = 0, hasError = false, maxMinutes = 0;
  const bars = [];

  card.querySelectorAll('.barrier-row').forEach(row => {
    const input = row.querySelector('.time-input');
    const subtotalTd = row.querySelector('.row-subtotal');
    if (!input || !subtotalTd) return;

    const res = validateTimeRange(input.value, year);
    const valEl = subtotalTd.querySelector('.sub-val') || subtotalTd;
    const barEl = subtotalTd.querySelector('.sub-bar > i');
    subtotalTd.classList.remove('bad');
    row.classList.toggle('is-empty', res.empty);
    row.classList.toggle('is-filled', !res.empty && res.ok);

    if (res.empty) {
      setFieldState(input, 'none', '');
      valEl.innerText = formatMinutes(0);
      subtotalTd.classList.add('zero');
    } else if (!res.ok) {
      hasError = true;
      if (input === document.activeElement && isPartialRange(input.value)) {
        setFieldState(input, 'pending', '尚未輸入完成，請繼續輸入結束時間');
        valEl.innerText = '輸入中…';
        subtotalTd.classList.add('zero');
      } else {
        setFieldState(input, 'err', res.msg);
        valEl.innerText = '格式錯誤';
        subtotalTd.classList.remove('zero');
        subtotalTd.classList.add('bad');
      }
    } else {
      totalMinutes += res.minutes;
      if (res.minutes > maxMinutes) maxMinutes = res.minutes;
      setFieldState(input, 'ok', rangeText(res) + (res.crossYear ? '（跨年）' : ''));
      valEl.innerText = formatMinutes(res.minutes);
      subtotalTd.classList.toggle('zero', res.minutes === 0);
      if (barEl) bars.push({ el: barEl, mins: res.minutes });
    }
    if (barEl && (res.empty || !res.ok)) barEl.style.width = '0%';
  });

  // 佔比橫條以「最長的一項」為 100%，凸顯影響最大的事由
  bars.forEach(b => {
    b.el.style.width = maxMinutes > 0 ? (b.mins / maxMinutes * 100).toFixed(1) + '%' : '0%';
  });

  card.querySelector('.total-hours').innerText = formatMinutes(totalMinutes);

  const arrestInput = card.querySelector('.arrest-time-input');
  const arrestRes = validateSingleTime(arrestInput.value, year);
  const deadlineTd = card.querySelector('.deadline-result');

  if (arrestRes.empty) {
    setFieldState(arrestInput, 'none', '');
    deadlineTd.innerText = '請先填逮捕時間';
    deadlineTd.classList.remove('highlight-text', 'highlight-ready');
  } else if (!arrestRes.ok) {
    hasError = true;
    if (arrestInput === document.activeElement && /^\d{1,7}$/.test(arrestInput.value)) {
      setFieldState(arrestInput, 'pending', '尚未輸入完成 (需 8 碼)');
    } else {
      setFieldState(arrestInput, 'err', arrestRes.msg);
    }
    deadlineTd.innerText = '逮捕時間格式錯誤';
    deadlineTd.classList.remove('highlight-text', 'highlight-ready');
  } else {
    setFieldState(arrestInput, 'ok', rocDateTimeText(arrestRes.date));
    const p = rocParts(new Date(arrestRes.date.getTime() + (16 * 60 + totalMinutes) * 60000));
    deadlineTd.innerText = `${p.date} ${p.time}`;
    deadlineTd.classList.add('highlight-text', 'highlight-ready');
  }

  card.classList.toggle('has-error', hasError);
  scheduleGlobalUpdate();
}

function recalculateAll() {
  document.querySelectorAll('.suspect-card').forEach(card => {
    calculateSuspectTotal(parseInt(card.getAttribute('data-card-id'), 10));

  // 明確 flush：呼叫端（頁面載入／匯入還原／匯出前檢查）都需要「回傳當下」

/** 取得單一卡片的狀態，供總覽與節點圖共用 */
function cardStatus(card) {
  const name = card.querySelector('.name-input').value.trim();
  const total = card.querySelector('.total-hours').innerText;
  const deadline = card.querySelector('.deadline-result').innerText.replace(/\n/g, ' ').trim();
  const hasError = card.classList.contains('has-error');
  const done = /^\d/.test(deadline);
  return {
    name: name, total: total, deadline: deadline,
    state: hasError ? 'err' : (done ? 'ok' : 'warn'),
    done: done
  };
}

function buildNodeMap() {
  const list = document.getElementById('nodeList');
  if (!list) return;
  const cards = Array.from(document.querySelectorAll('.suspect-card'));

  let html = cards.map((card, idx) => {
    const s = cardStatus(card);
    const id = card.getAttribute('data-card-id');
    const meta = s.state === 'err' ? '有格式錯誤' : `障礙總計 ${s.total}`;
    const deadline = s.done ? `滿 16 小時 ${s.deadline}` : '尚未填寫逮捕時間';
    return `<li class="node-item ${s.state}${String(id) === String(activeCardId) ? ' active' : ''}"
                data-card-id="${id}" onclick="jumpToCard('${id}')"
                title="跳至編號 ${idx + 1}${s.name ? '：' + escapeHtml(s.name) : ''}">
      <span class="node-dot">${idx + 1}</span>
      <span class="node-info">
        <span class="node-name">${s.name ? escapeHtml(s.name) : '（未填姓名）'}</span>
        <span class="node-meta">${escapeHtml(meta)}</span>
        <span class="node-deadline">${escapeHtml(deadline)}</span>
      </span>
    </li>`;
  }).join('');

  const full = cards.length >= 10;
  html += `<li class="node-item node-add${full ? ' disabled' : ''}"
               onclick="${full ? '' : 'addNewSuspectCard(null, true)'}" title="新增人犯">
    <span class="node-dot"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true">${ICONS.plus}</svg></span>
    <span class="node-info"><span class="node-name">${full ? '已達 10 人上限' : '新增人犯'}</span></span>
  </li>`;

  list.innerHTML = html;
}

function jumpToCard(id) {
  const card = document.querySelector(`.suspect-card[data-card-id="${id}"]`);
  if (!card) return;
  const headerH = document.querySelector('.app-header').offsetHeight;
  const y = card.getBoundingClientRect().top + window.pageYOffset - headerH - 14;
  window.scrollTo({ top: y, behavior: 'smooth' });
  setActiveNode(id);
  card.classList.add('flash');
  setTimeout(() => card.classList.remove('flash'), 1000);
}

function setActiveNode(id) {
  activeCardId = id;
  document.querySelectorAll('.node-item[data-card-id]').forEach(li => {
    li.classList.toggle('active', li.getAttribute('data-card-id') === String(id));
  });
}

function observeCards() {
  if (cardObserver) cardObserver.disconnect();
  if (typeof IntersectionObserver === 'undefined') return;
  cardObserver = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) setActiveNode(e.target.getAttribute('data-card-id'));
    });
  }, { rootMargin: '-25% 0px -65% 0px', threshold: 0 });
  document.querySelectorAll('.suspect-card').forEach(c => cardObserver.observe(c));
}

function collectErrors() {
  const year = getBaseYear();
  const errors = [];

  document.querySelectorAll('.suspect-card').forEach((card, idx) => {
    const arrestInput = card.querySelector('.arrest-time-input');
    const ar = validateSingleTime(arrestInput.value, year);
    if (!ar.ok) errors.push({ input: arrestInput, text: `編號 ${idx + 1} —「逮捕時間」：${ar.msg}` });

    card.querySelectorAll('.barrier-row').forEach(row => {
      const input = row.querySelector('.time-input');
      if (!input) return;
      const res = validateTimeRange(input.value, year);
      if (res.ok) return;

      let label = row.getAttribute('data-label') || '';
      if (row.getAttribute('data-type') === 'other') {
        const reason = row.querySelector('.reason-input');
        const r = reason ? reason.value.trim() : '';
        label = r ? `其他障礙時間 - ${r}` : '其他障礙時間';
      }
      if (!label) label = '障礙時間';
      errors.push({ input: input, text: `編號 ${idx + 1} —「${label}」：${res.msg}` });
    });
  });

  return errors;
}

function updateExportAvailability() {
  const errors = collectErrors();
  const banner = document.getElementById('errorBanner');
  const btn = document.getElementById('exportBtn');

  if (errors.length === 0) {
    banner.classList.remove('show');
    banner.innerHTML = '';
    btn.disabled = false;
    return;
  }

  btn.disabled = true;
  banner.classList.add('show');
  banner.innerHTML = `<b>有 ${errors.length} 個欄位格式錯誤，請修正後才能匯出：</b><ul>` +
    errors.map(e => `<li>${escapeHtml(e.text)}</li>`).join('') + '</ul>';
}

/* ---- 1. 匯入檔案的格式檢查與正規化 ---- */

const SUSPECT_KEYS = ['name', 'birth', 'idno', 'addr', 'arrestTime', 'arrestLoc', 'lawyer',
                      'lawyerWait', 'lawyerInterview', 'nightStop', 'traffic', 'other'];

/** 只接受字串/數字/布林，其餘（物件、陣列、null）一律視為空值，避免出現 [object Object] */
function str(v) {
  const t = typeof v;
  if (t === 'string') return v;
  if (t === 'number' && Number.isFinite(v)) return String(v);
  if (t === 'boolean') return String(v);
  return '';
}

function normalizeSuspect(s) {
  return {
    name: str(s.name), birth: str(s.birth), idno: str(s.idno), addr: str(s.addr),
    arrestTime: str(s.arrestTime), arrestLoc: str(s.arrestLoc), lawyer: str(s.lawyer),
    lawyerWait: str(s.lawyerWait), lawyerInterview: str(s.lawyerInterview), nightStop: str(s.nightStop),
    traffic: Array.isArray(s.traffic)
      ? s.traffic.filter(t => t && typeof t === 'object').map(t => ({ loc: str(t.loc), time: str(t.time) })) : [],
    other: Array.isArray(s.other)
      ? s.other.filter(o => o && typeof o === 'object').map(o => ({ reason: str(o.reason), time: str(o.time) })) : []
  };
}

/**
 * 檢查匯入內容是否為本系統的 JSON 檔
 * 回傳 { fatal } 代表無法匯入；{ data, tagged, futureVersion } 代表可匯入
 */
function inspectImportData(data) {
  if (data === null || typeof data !== 'object' || Array.isArray(data))
    return { fatal: '檔案的最外層不是一個 JSON 物件，這不是本系統匯出的檔案。' };

  if (!Array.isArray(data.suspects))
    return { fatal: '檔案中找不到「suspects」人犯資料陣列，這不是本系統匯出的檔案。' };

  if (data.suspects.length === 0)
    return { fatal: '檔案中沒有任何人犯資料。' };

  for (let i = 0; i < data.suspects.length; i++) {
    const s = data.suspects[i];
    if (!s || typeof s !== 'object' || Array.isArray(s))
      return { fatal: `第 ${i + 1} 筆人犯資料不是物件格式，檔案內容已損壞或不是本系統的檔案。` };
    if (!SUSPECT_KEYS.some(k => Object.prototype.hasOwnProperty.call(s, k)))
      return { fatal: `第 ${i + 1} 筆人犯資料找不到任何本系統的欄位（如 arrestTime、nightStop），這不是本系統匯出的檔案。` };
  }

  const version = Number(data.version);
  return {
    data: { year: str(data.year), suspects: data.suspects.map(normalizeSuspect) },
    tagged: data.app === APP_TAG,
    futureVersion: Number.isFinite(version) && version > DATA_VERSION ? version : null
  };
}

async function handleImportFile() {
  const fileInput = document.getElementById('importFile');
  const file = fileInput.files && fileInput.files[0];
  if (!file) return;

  try {
    const text = await file.text();
    let raw;
    try { raw = JSON.parse(text); }
    catch (e) { throw new Error('檔案不是有效的 JSON 格式，無法解析。'); }

    const result = inspectImportData(raw);
    if (result.fatal) throw new Error(result.fatal);

    // 缺少本系統識別標記 → 先跳警告讓使用者決定
    if (!result.tagged) {
      const go = await showModal({
        title: '這可能不是本系統的檔案', icon: 'alert',
        message: `「${file.name}」缺少本系統的識別標記（app: "${APP_TAG}"）。\n\n` +
                 `它可能來自其他程式、或內容曾被修改過。系統仍可讀出 ${result.data.suspects.length} 筆看起來像人犯資料的內容，` +
                 `但欄位不一定正確對應，匯入後請務必逐項核對。\n\n仍要嘗試匯入嗎？`,
        buttons: [{ label: '取消', value: false }, { label: '仍要匯入', value: true, danger: true }]
      });
      if (!go) { fileInput.value = ''; return; }
    } else if (result.futureVersion) {
      const go = await showModal({
        title: '檔案版本較新', icon: 'alert',
        message: `這個檔案的版本為 ${result.futureVersion}，比目前系統的版本 ${DATA_VERSION} 新。\n\n` +
                 `部分欄位可能無法完整讀取，是否仍要匯入？`,
        buttons: [{ label: '取消', value: false }, { label: '仍要匯入', value: true, danger: true }]
      });
      if (!go) { fileInput.value = ''; return; }
    }

    const count = result.data.suspects.length;
    const extra = count > 10 ? `\n（檔案含 ${count} 筆，只會匯入前 10 筆）` : '';
    const ok = await showConfirm(
      `即將以「${file.name}」的內容取代目前所有資料。\n\n檔案中有 ${count} 位人犯。${extra}\n\n目前尚未存檔的內容將會遺失，是否繼續？`,
      '匯入 JSON', '匯入');
    if (!ok) { fileInput.value = ''; return; }

    applyState(result.data);
    toast(`已匯入 ${document.querySelectorAll('.suspect-card').length} 位人犯的資料`, 'import');
  } catch (err) {
    await showError('匯入失敗：' + err.message, '匯入失敗');
  }
  fileInput.value = '';
}

function line(text, bold) { return { t: text, b: !!bold }; }
function textCell(v, align) { return { lines: v && v.trim() ? [line(v.trim())] : [], align: align || 'center' }; }

function rangeCellLines(res) {
  const lines = [];
  if (res.empty || !res.ok) return lines;
  lines.push(line(rangeText(res)));
  if (res.minutes > 0) lines.push(line(`合計 ${formatMinutes(res.minutes)}`, true));
  return lines;
}

/** 建立單一人犯的一列匯出資料（供一般匯出與匯出進度條的漸進式處理共用） */
function buildExportRowForCard(card, idx, year) {
    const d = collectCardData(card);
    const arrestRes = validateSingleTime(d.arrestTime, year);
    const waitRes = validateTimeRange(d.lawyerWait, year);
    const interviewRes = validateTimeRange(d.lawyerInterview, year);
    const nightRes = validateTimeRange(d.nightStop, year);

    const trafficLines = [];
    let trafficTotal = 0;
    d.traffic.forEach((t, tIdx) => {
      const loc = (t.loc || '').trim();
      const res = validateTimeRange(t.time, year);
      trafficTotal += res.ok ? res.minutes : 0;
      if (!loc && (res.empty || !res.ok)) return;
      if (trafficLines.length > 0) trafficLines.push(line(''));
      if (d.traffic.length > 1) trafficLines.push(line(`第 ${tIdx + 1} 段：`, true));
      if (loc) trafficLines.push(line('地點：' + loc));
      if (res.ok && !res.empty) trafficLines.push(line(rangeText(res)));
    });
    if (trafficTotal > 0) trafficLines.push(line(`合計 ${formatMinutes(trafficTotal)}`, true));

    const otherLines = [];
    let otherTotal = 0;
    d.other.forEach(o => {
      const reason = (o.reason || '').trim();
      const res = validateTimeRange(o.time, year);
      otherTotal += res.ok ? res.minutes : 0;
      if (!reason && (res.empty || !res.ok)) return;
      if (otherLines.length > 0) otherLines.push(line(''));
      if (reason) otherLines.push(line('事由：' + reason, true));
      if (res.ok && !res.empty) otherLines.push(line(rangeText(res)));
    });
    if (otherTotal > 0) otherLines.push(line(`合計 ${formatMinutes(otherTotal)}`, true));

    const totalMins = (waitRes.ok ? waitRes.minutes : 0)
                    + (interviewRes.ok ? interviewRes.minutes : 0)
                    + trafficTotal
                    + (nightRes.ok ? nightRes.minutes : 0)
                    + otherTotal;

    const arrestLines = [];
    if (arrestRes.ok && !arrestRes.empty) {
      const p = rocParts(arrestRes.date);
      arrestLines.push(line(p.date), line(p.time));
    }

    const deadlineLines = [];
    if (arrestRes.ok && !arrestRes.empty) {
      const p = rocParts(new Date(arrestRes.date.getTime() + (16 * 60 + totalMins) * 60000));
      deadlineLines.push(line(p.date, true), line(p.time, true));
    } else {
      deadlineLines.push(line('--'));
    }

    return [
      { lines: [line(String(idx + 1))], align: 'center' },
      textCell(d.name,  'center'),
      textCell(d.birth, 'center'),
      textCell(d.idno,  'center'),
      textCell(d.addr,  'left'),
      { lines: arrestLines, align: 'center' },
      textCell(d.arrestLoc, 'left'),
      textCell(d.lawyer, 'center'),
      { lines: rangeCellLines(waitRes),      align: 'center' },
      { lines: rangeCellLines(interviewRes), align: 'center' },
      { lines: trafficLines,                 align: 'left'   },
      { lines: rangeCellLines(nightRes),     align: 'center' },
      { lines: otherLines,                   align: 'left'   },
      { lines: [line(formatMinutes(totalMins), true)], align: 'center' },
      { lines: deadlineLines,                align: 'center' }
    ];
}

/* =========================================================================
   共用工具
   ========================================================================= */

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
const escapeXml = escapeHtml;

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}

const CRC_TABLE = (function() {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function utf8(str) { return new TextEncoder().encode(str); }

function buildZip(entries) {
  const chunks = [], central = [];
  let offset = 0;

  const now = new Date();
  const dosTime = ((now.getHours() << 11) | (now.getMinutes() << 5) | (now.getSeconds() >> 1)) & 0xFFFF;
  const dosDate = (((now.getFullYear() - 1980) << 9) | ((now.getMonth() + 1) << 5) | now.getDate()) & 0xFFFF;

  entries.forEach(entry => {
    const nameBytes = utf8(entry.name);
    const data = entry.data;
    const crc = crc32(data);

    const local = new Uint8Array(30 + nameBytes.length);
    const lv = new DataView(local.buffer);
    lv.setUint32(0, 0x04034b50, true);
    lv.setUint16(4, 20, true);
    lv.setUint16(6, 0x0800, true);
    lv.setUint16(8, 0, true);
    lv.setUint16(10, dosTime, true);
    lv.setUint16(12, dosDate, true);
    lv.setUint32(14, crc, true);
    lv.setUint32(18, data.length, true);
    lv.setUint32(22, data.length, true);
    lv.setUint16(26, nameBytes.length, true);
    lv.setUint16(28, 0, true);
    local.set(nameBytes, 30);
    chunks.push(local, data);

    const cd = new Uint8Array(46 + nameBytes.length);
    const cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true);
    cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true);
    cv.setUint16(10, 0, true);
    cv.setUint16(12, dosTime, true);
    cv.setUint16(14, dosDate, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true);
    cv.setUint16(28, nameBytes.length, true);
    cv.setUint16(30, 0, true);
    cv.setUint16(32, 0, true);
    cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true);
    cv.setUint32(38, 0, true);
    cv.setUint32(42, offset, true);
    cd.set(nameBytes, 46);
    central.push(cd);

    offset += local.length + data.length;
  });

  const centralSize = central.reduce((s, c) => s + c.length, 0);
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(4, 0, true);
  ev.setUint16(6, 0, true);
  ev.setUint16(8, entries.length, true);
  ev.setUint16(10, entries.length, true);
  ev.setUint32(12, centralSize, true);
  ev.setUint32(16, offset, true);
  ev.setUint16(20, 0, true);

  return new Blob([...chunks, ...central, eocd], { type: 'application/octet-stream' });
}
