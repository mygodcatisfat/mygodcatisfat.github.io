    // 驗證 Gemini API Key 是否可用（呼叫輕量的 list models 端點，不消耗生成額度）
    async function verifyGeminiApiKey() {
        const input = document.getElementById('geminiApiKeyInput');
        const statusEl = document.getElementById('geminiKeyStatus');
        const verifyBtn = document.getElementById('geminiVerifyKeyBtn');
        const key = input.value.trim();

        if (!key) {
            statusEl.textContent = '請先輸入 API Key。';
            statusEl.className = 'text-sm text-red-500';
            return;
        }

        geminiApiKeyValid = false;
        updateOcrGeminiUI();
        verifyBtn.disabled = true;
        verifyBtn.textContent = '驗證中...';
        statusEl.textContent = '正在驗證金鑰，請稍候...';
        statusEl.className = 'text-sm text-gray-500';

        try {
            const resp = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
            if (resp.ok) {
                geminiApiKey = key;
                geminiApiKeyValid = true;
                statusEl.textContent = '✅ 金鑰驗證成功，可以開始使用。';
                statusEl.className = 'text-sm text-green-500';
            } else {
                const errData = await resp.json().catch(() => null);
                const msg = (errData && errData.error && errData.error.message) || `驗證失敗 (HTTP ${resp.status})`;
                statusEl.textContent = `❌ ${msg}`;
                statusEl.className = 'text-sm text-red-500';
            }
        } catch (error) {
            console.error('Gemini API key verification error:', error);
            statusEl.textContent = '❌ 無法連線至 Gemini API，請檢查網路連線。';
            statusEl.className = 'text-sm text-red-500';
        } finally {
            verifyBtn.disabled = false;
            verifyBtn.textContent = '驗證';
            updateOcrGeminiUI();
        }
    }

    document.getElementById('geminiVerifyKeyBtn').addEventListener('click', verifyGeminiApiKey);

    // 呼叫 Gemini API 辨識單一頁面圖片中的文字
    async function recognizeImageWithGemini(base64Data, apiKey) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${GEMINI_MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
        const body = {
            contents: [{
                parts: [
                    { text: '請將這張圖片中的所有文字逐字辨識並輸出。圖片內容可能包含繁體中文與英文。只需輸出辨識到的純文字內容，保留原始的斷行，不要加上任何說明、標題或 Markdown 格式。' },
                    { inline_data: { mime_type: 'image/png', data: base64Data } }
                ]
            }]
        };

        const resp = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
        });

        if (!resp.ok) {
            const errData = await resp.json().catch(() => null);
            throw new Error((errData && errData.error && errData.error.message) || `Gemini API 錯誤 (HTTP ${resp.status})`);
        }

        const data = await resp.json();
        const parts = (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [];
        return parts.map(p => p.text || '').join('');
    }

                const page = await loadedPDF.getPage(i);
                const viewport = page.getViewport({ scale: 2.5 });
                const canvas = document.createElement('canvas');
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                const context = canvas.getContext('2d');
                await page.render({ canvasContext: context, viewport: viewport }).promise;

                statusEl.textContent = `正在透過 Gemini 辨識第 ${i} / ${endPageNum} 頁...`;
                const dataUrl = canvas.toDataURL('image/png');
                const base64Data = dataUrl.split(',')[1];

                const text = await recognizeImageWithGemini(base64Data, geminiApiKey);

                fullText += `--- 辨識頁碼 ${i} ---\n\n`;
                fullText += text.trim() + '\n\n';

                // 釋放 canvas 記憶體，避免長文件累積佔用
                canvas.width = 0;
                canvas.height = 0;

                const done = i - startPageNum + 1;
                progressBar.style.width = `${Math.round((done / totalPages) * 100)}%`;
            }

            originalOcrGeminiText = fullText;
            applyPunctuationFiltersGeneric(originalOcrGeminiText, puncTogglesGemini, resultText);

            statusEl.textContent = '辨識完成。';
            statusEl.classList.add('text-green-500');
            document.getElementById('ocrGeminiResultTools').classList.remove('hidden');
            document.getElementById('copyOcrGeminiTextBtn').disabled = originalOcrGeminiText.length === 0;

        } catch (error) {
            console.error('Gemini OCR Error:', error);
            showMessage('使用 Gemini 辨識文字時發生錯誤。');
            statusEl.textContent = `錯誤: ${error.message || '未知錯誤'}`;
            statusEl.classList.remove('text-green-500');
            progressContainer.classList.add('hidden');
            progressBar.style.width = '0%';
        } finally {
            updateOcrGeminiUI();
        }
    });

    document.querySelectorAll('#ocrGeminiResultTools .punc-btn').forEach(button => {
        button.addEventListener('click', () => {
            const type = button.dataset.type;
            if (type in puncTogglesGemini) {
                puncTogglesGemini[type] = !puncTogglesGemini[type];
                button.classList.toggle('active', puncTogglesGemini[type]);
                applyPunctuationFiltersGeneric(originalOcrGeminiText, puncTogglesGemini, document.getElementById('ocrGeminiResultText'));
            }
        });
    });

    const copyOcrGeminiTextBtn = document.getElementById('copyOcrGeminiTextBtn');
    copyOcrGeminiTextBtn.addEventListener('click', () => {
        copyTextToClipboard(document.getElementById('ocrGeminiResultText').value);
    });

    document.addEventListener('keydown', (event) => {
        const targetElement = event.target;
        if (targetElement) {
            const tagName = targetElement.tagName.toUpperCase();
            if (tagName === 'INPUT' || tagName === 'TEXTAREA' || tagName === 'SELECT') {
                return;
            }
        }

        if (currentMode === 'merge') {
            if (event.key === 'Delete' && selectedFileIndex !== -1) {
                deleteFileBtn.click();
            } else if (event.key === 'ArrowUp' && selectedFileIndex > 0) {
                const fileToMove = filesForMerge.splice(selectedFileIndex, 1)[0];
                filesForMerge.splice(selectedFileIndex - 1, 0, fileToMove);
                selectedFileIndex--;
                renderMergeFileList();
                const newSelection = document.querySelectorAll('.sortable-item')[selectedFileIndex];
                newSelection.classList.add('ring-2', 'ring-blue-500');
            } else if (event.key === 'ArrowDown' && selectedFileIndex < filesForMerge.length - 1 && selectedFileIndex !== -1) {
                const fileToMove = filesForMerge.splice(selectedFileIndex, 1)[0];
                filesForMerge.splice(selectedFileIndex + 1, 0, fileToMove);
                selectedFileIndex++;
                renderMergeFileList();
                const newSelection = document.querySelectorAll('.sortable-item')[selectedFileIndex];
                newSelection.classList.add('ring-2', 'ring-blue-500');
            }
        } else if (currentMode === 'rotate' && (event.key === 'r' || event.key === 'R') && selectedRotatePage !== -1) {
            rotatePageBtn.click();
        }
    });

    // 全螢幕預覽功能
    async function showFullScreenPreview(pdfDoc, pageNum) {
        fullScreenPDF = pdfDoc;
        fullScreenPage = pageNum;
        // 先顯示 modal 再渲染，避免在 display:none 狀態下量測影像尺寸導致框選層變成 0x0
        fullScreenPreview.classList.remove('hidden');
        await renderFullScreenPage();

        // 綁定鍵盤事件
        document.addEventListener('keydown', handleFullScreenKeys);
    }

    async function renderFullScreenPage() {
        if (!fullScreenPDF) return;

        bboxOverlayCanvas.classList.add('hidden');
        // 僅在「文字辨識(前端)」頁籤且該頁已用框選模式辨識過時，才顯示可互動的框選層
        const bboxData = (currentMode === 'ocr') ? ocrPageData[fullScreenPage] : null;

        if (bboxData) {
            previewLines = bboxData.lines;
            previewNaturalSize = { w: bboxData.width, h: bboxData.height };
            previewImage.src = bboxData.imageDataUrl;
            await new Promise(resolve => {
                if (previewImage.complete) resolve();
                else previewImage.onload = resolve;
            });
            bboxControlPanel.classList.remove('hidden');
            bboxPageHint.textContent = `第 ${fullScreenPage} 頁：共 ${bboxData.lines.length} 個文字區塊，單擊切換單一區塊，按住拖曳可批次切換。`;
            setupOverlayCanvas();
        } else {
            previewLines = null;
            bboxControlPanel.classList.add('hidden');
            const page = await fullScreenPDF.getPage(fullScreenPage);
            const viewport = page.getViewport({ scale: 2 });
            const canvas = document.createElement('canvas');
            canvas.width = viewport.width;
            canvas.height = viewport.height;
            const context = canvas.getContext('2d');
            await page.render({ canvasContext: context, viewport: viewport }).promise;
            previewImage.src = canvas.toDataURL();
        }
    }

    function setupOverlayCanvas() {
        bboxOverlayCanvas.classList.remove('hidden');
        const w = previewImage.clientWidth;
        const h = previewImage.clientHeight;
        bboxOverlayCanvas.width = w;
        bboxOverlayCanvas.height = h;
        bboxOverlayCanvas.style.width = w + 'px';
        bboxOverlayCanvas.style.height = h + 'px';
        redrawOverlay();
    }

    function redrawOverlay() {
        if (!previewLines) return;
        const ctx = bboxOverlayCanvas.getContext('2d');
        ctx.clearRect(0, 0, bboxOverlayCanvas.width, bboxOverlayCanvas.height);
        const scaleX = bboxOverlayCanvas.width / previewNaturalSize.w;
        const scaleY = bboxOverlayCanvas.height / previewNaturalSize.h;

        previewLines.forEach(line => {
            const { x0, y0, x1, y1 } = line.bbox;
            const dx = x0 * scaleX, dy = y0 * scaleY, dw = (x1 - x0) * scaleX, dh = (y1 - y0) * scaleY;
            if (line.selected) {
                ctx.fillStyle = 'rgba(34, 197, 94, 0.28)';
                ctx.strokeStyle = '#16a34a';
            } else {
                ctx.fillStyle = 'rgba(156, 163, 175, 0.22)';
                ctx.strokeStyle = '#6b7280';
            }
            ctx.lineWidth = 1.5;
            ctx.fillRect(dx, dy, dw, dh);
            ctx.strokeRect(dx, dy, dw, dh);
        });
    }

    function hitTestLine(x, y) {
        if (!previewLines) return -1;
        const scaleX = bboxOverlayCanvas.width / previewNaturalSize.w;
        const scaleY = bboxOverlayCanvas.height / previewNaturalSize.h;
        for (let idx = previewLines.length - 1; idx >= 0; idx--) {
            const { x0, y0, x1, y1 } = previewLines[idx].bbox;
            const dx = x0 * scaleX, dy = y0 * scaleY, dw = (x1 - x0) * scaleX, dh = (y1 - y0) * scaleY;
            if (x >= dx && x <= dx + dw && y >= dy && y <= dy + dh) return idx;
        }
        return -1;
    }

    function getOverlayCoords(e) {
        const rect = bboxOverlayCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return { x: clientX - rect.left, y: clientY - rect.top };
    }

    function bboxPointerDown(e) {
        if (!previewLines) return;
        e.preventDefault();
        const { x, y } = getOverlayCoords(e);
        const idx = hitTestLine(x, y);
        isBrushing = true;
        brushTouched.clear();
        brushTargetState = null;
        if (idx !== -1) {
            brushTargetState = !previewLines[idx].selected;
            previewLines[idx].selected = brushTargetState;
            brushTouched.add(idx);
            redrawOverlay();
        }
    }
    function bboxPointerMove(e) {
        if (!isBrushing || !previewLines) return;
        e.preventDefault();
        const { x, y } = getOverlayCoords(e);
        const idx = hitTestLine(x, y);
        if (idx !== -1 && !brushTouched.has(idx)) {
            if (brushTargetState === null) brushTargetState = !previewLines[idx].selected;
            previewLines[idx].selected = brushTargetState;
            brushTouched.add(idx);
            redrawOverlay();
        }
    }
    function bboxPointerUp() {
        if (!isBrushing) return;
        isBrushing = false;
        if (brushTouched.size > 0) rebuildFullOcrText();
        brushTouched.clear();
    }

    bboxOverlayCanvas.addEventListener('mousedown', bboxPointerDown);
    bboxOverlayCanvas.addEventListener('mousemove', bboxPointerMove);
    window.addEventListener('mouseup', bboxPointerUp);
    bboxOverlayCanvas.addEventListener('touchstart', bboxPointerDown, { passive: false });
    bboxOverlayCanvas.addEventListener('touchmove', bboxPointerMove, { passive: false });
    window.addEventListener('touchend', bboxPointerUp);

    document.getElementById('bboxSelectAll').addEventListener('click', () => {
        if (!previewLines) return;
        previewLines.forEach(l => l.selected = true);
        redrawOverlay();
        rebuildFullOcrText();
    });
    document.getElementById('bboxDeselectAll').addEventListener('click', () => {
        if (!previewLines) return;
        previewLines.forEach(l => l.selected = false);
        redrawOverlay();
        rebuildFullOcrText();
    });
    document.getElementById('bboxInvert').addEventListener('click', () => {
        if (!previewLines) return;
        previewLines.forEach(l => l.selected = !l.selected);
        redrawOverlay();
        rebuildFullOcrText();
    });

    function closeFullScreenPreview() {
        fullScreenPreview.classList.add('hidden');
        fullScreenPDF = null;
        fullScreenPage = 0;
        previewLines = null;
        document.removeEventListener('keydown', handleFullScreenKeys);
    }

    function handleFullScreenKeys(e) {
        if (e.key === 'Escape') {
            closeFullScreenPreview();
        } else if (e.key === 'ArrowLeft') {
            navigatePreview(-1);
        } else if (e.key === 'ArrowRight') {
            navigatePreview(1);
        }
    }

    function navigatePreview(direction) {
        const newPage = fullScreenPage + direction;
        if (newPage >= 1 && newPage <= fullScreenPDF.numPages) {
            fullScreenPage = newPage;
            renderFullScreenPage();
        }
    }

    previewPrevBtn.addEventListener('click', () => navigatePreview(-1));
    previewNextBtn.addEventListener('click', () => navigatePreview(1));

    fullScreenPreview.addEventListener('click', (e) => {
        if (e.target === fullScreenPreview) {
            closeFullScreenPreview();
        }
    });

    function downloadPDF(pdfBytes, filename) {
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `${filename}.pdf`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function formatDate(date) {
        const yyyy = date.getFullYear().toString();
        const mm = (date.getMonth() + 1).toString().padStart(2, '0');
        const dd = date.getDate().toString().padStart(2, '0');
        const hh = date.getHours().toString().padStart(2, '0');
        const min = date.getMinutes().toString().padStart(2, '0');
        const ss = date.getSeconds().toString().padStart(2, '0');
        return `${yyyy}${mm}${dd}${hh}${min}${ss}`;
    }
	
    function resetFileStatus() {
		currentRenderId++;
        loadedPDF = null;
        singleLoadedFile = null;
        fileInput.value = '';
        fileStatus.textContent = '支援 .pdf 格式';
    }

    // 清除裁切 (Split) 資料
    const clearSplitBtn = document.getElementById('clearSplit');
    if (clearSplitBtn) {
        clearSplitBtn.addEventListener('click', () => {
            // 重置全域檔案狀態
            resetFileStatus();
            
            // 清空縮圖容器 (視覺上移除 PDF)
            splitThumbnails.innerHTML = '';
            
            // 重置輸入框與變數
            document.getElementById('splitStartPage').value = '';
            document.getElementById('splitEndPage').value = '';
            splitPoints = [];
            showInlineError('splitInlineError', '');

            // 禁用按鈕
            splitNextBtn.disabled = true;
        });
    }

    // 清除合成 (Merge) 資料
    const clearMergeBtn = document.getElementById('clearMerge');
    if (clearMergeBtn) {
        clearMergeBtn.addEventListener('click', () => {
            // 合成模式有自己的檔案陣列，需獨立處理
            filesForMerge = [];
            selectedFileIndex = -1;
            
            // 重置清單顯示
            renderMergeFileList(); // 這會自動顯示「請匯入 PDF...」
            
            // 重置狀態文字與 Input
            fileStatus.textContent = '支援 .pdf 格式';
            fileInput.value = '';
            
            // 禁用按鈕
            mergeNextBtn.disabled = true;
        });
    }

    // 清除頁碼 (PageNumber) 資料
    const clearPageNumberBtn = document.getElementById('clearPageNumber');
    if (clearPageNumberBtn) {
        clearPageNumberBtn.addEventListener('click', () => {
            // 重置全域檔案狀態
            resetFileStatus();
            
            // 重置輸入框為預設值
            document.getElementById('pageNumberStart').value = '1';
            document.getElementById('pageNumberFromPage').value = '';
            document.getElementById('pageNumberFromPage').placeholder = '頁碼'; // 重置 placeholder
            document.getElementById('pageNumberPosition').value = 'left';
            document.getElementById('pageNumberType').value = 'same';
            showInlineError('pageNumberInlineError', '');

            // 禁用按鈕
            pageNumberNextBtn.disabled = true;
        });
    }

    // 清除旋轉 (Rotate) 資料
    const clearRotateBtn = document.getElementById('clearRotate');
    if (clearRotateBtn) {
        clearRotateBtn.addEventListener('click', () => {
            // 重置全域檔案狀態
            resetFileStatus();
            
            // 清空縮圖容器
            rotateThumbnails.innerHTML = '';
            
            // 重置變數
            rotateRotations = [];
            selectedRotatePage = -1;
            
            // 重置操作區域 (如果已經變成匯出介面，要還原回「下一步」按鈕)
            const rotateActionArea = document.getElementById('rotateAction');
            rotateActionArea.innerHTML = `
                <button id="rotateNext" class="btn btn-blue btn-lg" disabled>下一步</button>
            `;
            // 重新抓取 DOM 並綁定事件 (因為被 innerHTML 覆蓋了)
            rotateNextBtn = document.getElementById('rotateNext');
            bindRotateNextExport(rotateNextBtn);

            // 禁用按鈕
            rotatePageBtn.disabled = true;
            rotateNextBtn.disabled = true;
        });
    }

    // 清除 OCR 資料
    const clearOcrBtn = document.getElementById('clearOcr');
    if (clearOcrBtn) {
        clearOcrBtn.addEventListener('click', () => {
            // 重置全域檔案狀態
            resetFileStatus();
            
            // 清空縮圖容器
            document.getElementById('ocrThumbnails').innerHTML = '';
            
            // 重置輸入框與變數
            document.getElementById('ocrStartPage').value = '';
            document.getElementById('ocrEndPage').value = '';
            ocrSplitPoints = [];
            showInlineError('ocrInlineError', '');

            // 清空結果與隱藏工具列
            const ocrResultText = document.getElementById('ocrResultText');
            if (ocrResultText) ocrResultText.value = '';
            originalOcrText = '';
            
            document.getElementById('ocrStatus').classList.add('hidden');
            document.getElementById('ocrStatus').textContent = '';
            document.getElementById('ocrResultTools').classList.add('hidden');
            document.getElementById('copyOcrTextBtn').disabled = true;
            document.getElementById('ocrProgressContainer').classList.add('hidden');
            document.getElementById('ocrProgressBar').style.width = '0%';

            // 重置標點符號按鈕
            puncToggles = { colon: false, comma: false, paren: false };
            document.querySelectorAll('#ocrResultTools .punc-btn').forEach(btn => btn.classList.remove('active'));

            // 重置框選功能狀態
            ocrPageData = {};
            ocrPageText = {};
            processedPages = [];
            enableBboxModeCheckbox.checked = false;
            bboxModeEnabled = false;
            bboxWarningEl.classList.add('hidden');

            // 禁用開始按鈕
            document.getElementById('ocrStartBtn').disabled = true;
        });
    }

    // 清除 Gemini OCR 資料（保留已驗證的 API Key，只清除檔案與辨識結果）
    const clearOcrGeminiBtn = document.getElementById('clearOcrGemini');
    if (clearOcrGeminiBtn) {
        clearOcrGeminiBtn.addEventListener('click', () => {
            resetFileStatus();

            document.getElementById('ocrGeminiThumbnails').innerHTML = '';

            document.getElementById('ocrGeminiStartPage').value = '';
            document.getElementById('ocrGeminiEndPage').value = '';
            ocrGeminiSplitPoints = [];
            showInlineError('ocrGeminiInlineError', '');

            const geminiResultText = document.getElementById('ocrGeminiResultText');
            if (geminiResultText) geminiResultText.value = '';
            originalOcrGeminiText = '';

            document.getElementById('ocrGeminiStatus').classList.add('hidden');
            document.getElementById('ocrGeminiStatus').textContent = '';
            document.getElementById('ocrGeminiResultTools').classList.add('hidden');
            document.getElementById('copyOcrGeminiTextBtn').disabled = true;
            document.getElementById('ocrGeminiProgressContainer').classList.add('hidden');
            document.getElementById('ocrGeminiProgressBar').style.width = '0%';

            puncTogglesGemini = { colon: false, comma: false, paren: false };
            document.querySelectorAll('#ocrGeminiResultTools .punc-btn').forEach(btn => btn.classList.remove('active'));

            updateOcrGeminiUI();
        });
    }
</script>
